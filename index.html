<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOD Spinner</title>
<style>
  :root{
    --bg:#121417;
    --panel:#1b1e23;
    --panel-2:#23272d;
    --border:#33383f;
    --border-soft:#282c32;
    --yellow:#f5c518;
    --yellow-dim:#a98c1a;
    --red:#e0483e;
    --green:#4caf7d;
    --orange:#f0913a;
    --text:#f2f3f5;
    --text-dim:#9aa0a8;
    --text-faint:#5c6169;
    --white:#ffffff;
    --font-head:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--yellow);color:#121417;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 32px;
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
  }
  #spotify-banner:empty{display:none;}
  #import-banner:empty{display:none;}
  #spotify-banner, #import-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:12px 32px;
    background:#3a1414;
    border-bottom:1px solid var(--red);
    color:#ffb3ab;
    font-size:13px;
  }
  #spotify-banner button, #import-banner button{
    background:none;border:1px solid #ffb3ab;color:#ffb3ab;
    padding:5px 12px;font-size:12px;cursor:pointer;flex-shrink:0;
  }
  #spotify-banner.ok, #import-banner.ok{background:#123822;border-bottom:1px solid var(--green);color:#a8f0c6;}
  #spotify-banner.ok button, #import-banner.ok button{border-color:#a8f0c6;color:#a8f0c6;}
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    background:none;
    border:none;
    color:var(--text);
    font-family:var(--font-head);
    padding:0;
  }
  .brand-mark{
    width:34px;height:34px;
    background:var(--yellow);
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-6deg);
    flex-shrink:0;
  }
  .brand-mark svg{width:20px;height:20px;transform:rotate(6deg);}
  .brand-name{
    font-size:20px;
    font-weight:800;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .nav-actions{display:flex;gap:8px;}
  .nav-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .nav-btn:hover{border-color:var(--yellow-dim);color:var(--text);}
  .nav-btn.active{border-color:var(--yellow);color:var(--yellow);}

  /* ---------- Account widget ---------- */
  .account-menu-wrap{position:relative;}
  .btn-google{background:#fff;color:#3c4043;border-color:#dadce0;font-weight:700;}
  .btn-google:hover{background:#f1f3f4;}
  .account-pill{background:var(--panel-2);display:flex;align-items:center;gap:8px;}
  .avatar-thumb{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .avatar-thumb-lg{width:72px;height:72px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--panel-2);}
  .avatar-placeholder{
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:var(--yellow);color:#121417;font-weight:800;flex-shrink:0;
  }
  .account-dropdown{
    position:absolute; top:calc(100% + 8px); right:0;
    background:var(--panel); border:1px solid var(--border);
    padding:14px; min-width:200px; z-index:50;
  }
  .account-dropdown-name{font-weight:700;font-size:14px;}
  .account-dropdown-email{font-size:12px;color:var(--text-faint);margin-bottom:10px;word-break:break-all;}
  .account-dropdown-divider{height:1px;background:var(--border-soft);margin:10px 0;}
  .account-dropdown-item{
    display:block; width:100%; text-align:left;
    background:none; border:none; color:var(--text);
    padding:9px 4px; font-size:13px; cursor:pointer; font-family:var(--font-body);
  }
  .account-dropdown-item:hover{color:var(--yellow);}
  .account-dropdown-logout{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px; font-size:13px; cursor:pointer; font-family:var(--font-body);
  }
  .account-dropdown-logout:hover{border-color:var(--red);color:var(--red);}

  /* ---------- Main container ---------- */
  main{flex:1;display:flex;flex-direction:column;overflow:auto;}
  .screen{flex:1;display:flex;flex-direction:column;padding:40px 32px;}
  .screen-narrow{max-width:1100px;margin:0 auto;width:100%;}

  .eyebrow-block{text-align:center;margin-bottom:36px;}
  h1.page-title{
    font-family:var(--font-head);
    font-size:38px;
    font-weight:800;
    letter-spacing:0.01em;
    margin:0 0 8px 0;
  }
  p.page-sub{
    color:var(--text-dim);
    font-size:15px;
    margin:0;
  }

  /* ---------- Landing: group size grid ---------- */
  .size-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    max-width:820px;
    margin:0 auto;
    width:100%;
  }
  .size-tile{
    aspect-ratio:1/1;
    background:var(--panel);
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s, background .12s;
    position:relative;
  }
  .size-tile:hover{border-color:var(--yellow);transform:translateY(-2px);}
  .size-tile:active{transform:translateY(0);}
  .size-tile .num{
    font-family:var(--font-mono);
    font-size:44px;
    font-weight:700;
    line-height:1;
  }
  .size-tile .label{
    font-size:11px;
    color:var(--text-faint);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .size-tile.solo::before{
    content:"SOLO / PAIR";
  }

  /* ---------- Picker: 4 columns ---------- */
  .picker-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  .picker-header h2{
    font-family:var(--font-head);
    font-size:24px;
    margin:0;
  }
  .picker-header .sub{color:var(--text-dim);font-size:14px;margin-top:4px;}
  .picker-controls{display:flex;gap:10px;}
  .btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:13px;
    padding:11px 20px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .btn:hover{border-color:var(--yellow);}
  .btn-primary{background:var(--yellow);color:#121417;border-color:var(--yellow);}
  .btn-primary:hover{background:#ffd23f;}
  .btn-ghost{background:transparent;}
  .btn-back{padding:11px 18px 11px 14px;}

  .spin-again-wrap{display:flex;justify-content:center;margin-top:32px;}
  .btn-spin{
    font-family:var(--font-head);
    font-weight:800;
    font-size:18px;
    letter-spacing:.02em;
    padding:18px 48px;
    background:var(--yellow);
    color:#121417;
    border:none;
    cursor:pointer;
    transition:transform .1s, background .15s;
  }
  .btn-spin:hover{background:#ffd23f;transform:translateY(-2px);}
  .btn-spin:active{transform:translateY(0);}

  .card-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    align-items:stretch;
  }
  @media (max-width:1000px){
    .card-row{grid-template-columns:repeat(2,1fr);}
    .size-grid{grid-template-columns:repeat(3,1fr);}
  }
  .wod-card{
    background:var(--panel);
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    cursor:pointer;
    transition:transform .12s, border-color .12s;
    overflow:hidden;
  }
  .wod-card:hover{transform:translateY(-3px);border-color:var(--tier-color, var(--yellow));}
  .wod-card-band{
    height:6px;
    background:var(--tier-color);
  }
  .wod-card-head{
    padding:18px 18px 14px 18px;
    border-bottom:1px solid var(--border-soft);
  }
  .wod-card-tier{
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--tier-color);
  }
  .wod-card-duration{
    font-family:var(--font-head);
    font-size:30px;
    font-weight:800;
    margin-top:2px;
  }
  .wod-card-format{
    font-size:13px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .wod-card-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:8px;}
  .wod-card-body .struct{
    font-size:12px;
    color:var(--text-faint);
    font-family:var(--font-mono);
    margin-bottom:4px;
  }
  .ex-line{
    font-size:13px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:5px 0;
    border-bottom:1px dashed var(--border-soft);
  }
  .ex-line:last-child{border-bottom:none;}
  .ex-name{color:var(--text);}
  .ex-amount{font-family:var(--font-mono);color:var(--text-dim);white-space:nowrap;}
  .wod-card-foot{
    padding:12px 18px;
    border-top:1px solid var(--border-soft);
    font-size:12px;
    color:var(--text-faint);
  }

  /* ---------- Full screen workout ---------- */
  .full-workout{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:1700px;
    width:100%;
    margin:0 auto;
  }
  .full-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:16px;
  }
  .full-head-left .tier-tag{
    font-family:var(--font-mono);
    font-size:clamp(13px, 1vw, 16px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--tier-color);
  }
  .full-head-left h1{
    font-family:var(--font-head);
    font-size:clamp(42px, 3.2vw, 60px);
    margin:4px 0 6px 0;
  }
  .full-head-left .meta{color:var(--text-dim);font-size:clamp(15px, 1.1vw, 18px);}
  .full-actions{display:flex;gap:10px;}
  .full-body{
    flex:1;
    display:grid;
    grid-template-columns:1fr minmax(400px, 33vw);
    gap:24px;
    align-items:start;
  }
  .full-left{display:flex;flex-direction:column;gap:20px;min-width:0;}
  @media (max-width:1050px){
    .full-body{grid-template-columns:1fr;}
  }
  .full-notice{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-left:4px solid var(--yellow);
    padding:14px 18px;
    font-size:14px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .full-exlist{
    background:var(--panel);
    border:1px solid var(--border);
  }
  .full-exlist .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:clamp(14px,1.3vw,22px) clamp(22px,1.8vw,32px);
    border-bottom:1px solid var(--border-soft);
    gap:16px;
  }
  .full-exlist .row:last-child{border-bottom:none;}
  .full-exlist .exname{font-size:clamp(17px, 1.3vw, 24px);font-weight:600;}
  .full-exlist .excue{font-size:clamp(13px, 0.95vw, 16px);color:var(--text-faint);margin-top:3px;max-width:900px;line-height:1.4;}
  .full-exlist .examount{font-family:var(--font-mono);font-size:clamp(20px, 1.6vw, 30px);color:var(--yellow);white-space:nowrap;flex-shrink:0;}
  .full-exlist .row.trigger-row{background:var(--panel-2);}
  .trigger-tag{
    display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:700;
    letter-spacing:.05em;color:#121417;background:var(--yellow);
    padding:2px 6px;margin-left:8px;vertical-align:middle;
  }
  .trigger-tag.core-tag{background:var(--green);}

  /* ---------- Timer ---------- */
  .full-right{
    display:flex;
    flex-direction:column;
    gap:16px;
    position:sticky;
    top:20px;
  }
  .timer-panel{
    background:var(--panel);
    border:1px solid var(--border);
    padding:clamp(26px,2.2vw,44px) clamp(20px,1.8vw,32px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .timer-phase{
    font-family:var(--font-mono);
    font-size:clamp(14px, 1.1vw, 19px);
    font-weight:700;
    letter-spacing:.03em;
    color:var(--tier-color, var(--yellow));
    text-align:center;
    min-height:20px;
  }
  .timer-display{
    font-family:var(--font-mono);
    font-size:clamp(68px, 6.5vw, 130px);
    font-weight:700;
    line-height:1;
    letter-spacing:.02em;
    margin:8px 0;
  }
  .timer-display.warn{color:var(--red);}
  .timer-meta{color:var(--text-dim);font-size:clamp(13px, 0.95vw, 16px);}
  .timer-total{color:var(--text-faint);font-size:clamp(12px, 0.85vw, 14px);font-family:var(--font-mono);margin-bottom:16px;min-height:16px;}
  .timer-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .timer-btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:clamp(15px, 1.1vw, 18px);
    padding:clamp(14px,1.2vw,18px) clamp(20px,1.8vw,28px);
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    min-width:96px;
    transition:border-color .15s, background .15s;
  }
  .timer-btn:hover{border-color:var(--yellow);}
  .timer-btn.start{background:var(--green);border-color:var(--green);color:#0d1410;}
  .timer-btn.start:hover{background:#5fc491;}
  .timer-btn.pause{background:var(--yellow);border-color:var(--yellow);color:#121417;}
  .timer-btn.pause:hover{background:#ffd23f;}
  .timer-btn:disabled{opacity:.35;cursor:not-allowed;}

  /* ---------- Celebration modal ---------- */
  #celebration-root:empty{display:none;}
  .celebration-overlay{
    position:fixed; inset:0; background:rgba(8,9,11,0.85);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .celebration-card{
    position:relative; background:var(--panel); border:1px solid var(--border);
    max-width:min(780px, 92vw); width:100%; padding:clamp(40px,5vw,64px) clamp(32px,4vw,56px) clamp(32px,4vw,48px);
    text-align:center; overflow:hidden;
  }
  .celebration-close{
    position:absolute; top:12px; right:12px;
    background:none; border:none; color:var(--text-faint);
    font-size:clamp(28px, 2.4vw, 38px); line-height:1; cursor:pointer; padding:6px 10px; z-index:3;
  }
  .celebration-close:hover{color:var(--text);}
  .celebration-message{
    font-family:var(--font-head); font-size:clamp(26px, 3vw, 40px); font-weight:800; line-height:1.3;
    margin:10px 0 14px 0; position:relative; z-index:2;
  }
  .celebration-meta{color:var(--text-dim); font-size:clamp(15px, 1.3vw, 19px); margin-bottom:clamp(28px,3vw,40px); position:relative; z-index:2;}
  .celebration-feedback{position:relative; z-index:2; border-top:1px solid var(--border-soft); padding-top:clamp(24px,2.6vw,34px); min-height:36px;}
  .celebration-feedback-label{font-size:clamp(16px, 1.4vw, 20px); color:var(--text-dim); margin-bottom:16px;}
  .celebration-feedback-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .celebration-feedback-btns button{
    font-family:var(--font-body); font-size:clamp(15px, 1.2vw, 18px); font-weight:700;
    padding:clamp(14px,1.3vw,18px) clamp(22px,2vw,30px); border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .celebration-feedback-btns button:hover{border-color:var(--yellow); transform:translateY(-2px);}
  .celebration-thanks{font-size:clamp(16px, 1.4vw, 20px); color:var(--green); font-weight:600;}
  .confetti-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;}
  .confetti-piece{position:absolute; top:-20px; animation-name:confetti-fall; animation-timing-function:linear; animation-iteration-count:infinite;}
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    88%{ opacity:1; }
    100%{ transform:translateY(680px) rotate(var(--rot,540deg)); opacity:0; }
  }

  /* ---------- Spotify ---------- */
  .spotify-panel{
    background:var(--panel);
    border:1px solid var(--border);
    padding:20px;
    margin-top:16px;
  }
  .sp-head{
    font-family:var(--font-head);
    font-size:14px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--text-dim);
    margin-bottom:12px;
  }
  .sp-note{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 14px 0;}
  .sp-note.sp-error{color:var(--red);}
  .btn-spotify{background:#1DB954;border-color:#1DB954;color:#0d1410;}
  .btn-spotify:hover{background:#22e065;}
  .sp-search-row{display:flex;gap:8px;margin-bottom:10px;}
  .sp-search-input{
    flex:1;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;font-size:13px;font-family:var(--font-body);
  }
  .sp-results{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto;}
  .sp-result{
    display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer;
    border:1px solid transparent;
  }
  .sp-result:hover{border-color:var(--yellow);background:var(--panel-2);}
  .sp-thumb{width:40px;height:40px;object-fit:cover;flex-shrink:0;}
  .sp-thumb-empty{background:var(--panel-2);}
  .sp-result-name{font-size:13px;font-weight:600;}
  .sp-result-owner{font-size:11px;color:var(--text-faint);}
  .sp-now-playing{display:flex;flex-direction:column;gap:12px;}
  .sp-playlist-name{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .sp-track-row{display:flex;align-items:center;gap:10px;}
  .sp-track-art{width:48px;height:48px;object-fit:cover;flex-shrink:0;}
  .sp-track-name{font-size:14px;font-weight:600;}
  .sp-track-artist{font-size:12px;color:var(--text-dim);}
  .sp-transport{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 0;}
  .sp-transport-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-size:16px;width:42px;height:42px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .sp-transport-btn:hover{border-color:var(--yellow);}
  .sp-transport-btn.active{border-color:var(--green);color:var(--green);background:#123822;}
  .sp-transport-btn.sp-transport-main{
    width:52px;height:52px;font-size:20px;
    background:var(--yellow);color:#121417;border-color:var(--yellow);
  }
  .sp-transport-btn.sp-transport-main:hover{background:#ffd23f;}

  /* ---------- Settings & Favourites ---------- */
  .panel-section{
    background:var(--panel);
    border:1px solid var(--border);
    padding:22px;
    margin-bottom:20px;
  }
  .panel-section h3{font-family:var(--font-head);font-size:17px;margin:0 0 14px 0;}
  .equip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
  .equip-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    background:var(--panel-2);
    border:1px solid var(--border-soft);
    font-size:13px;
    cursor:pointer;
  }
  .equip-item input{accent-color:var(--yellow);width:16px;height:16px;}
  .ex-table{width:100%;border-collapse:collapse;font-size:13px;}
  .ex-table th{
    text-align:left;color:var(--text-faint);font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;font-size:11px;
    padding:8px 10px;border-bottom:1px solid var(--border);
  }
  .ex-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}

const PATTERNS = ['push','pull','hinge','squat','lunge','carry','core','cardio','power'];

const FORMATS = {
  amrap:{name:'AMRAP', groupPools:['solo','three','four','mid','large']},
  emom:{name:'EMOM', groupPools:['solo','three','four','mid','large']},
  tabata:{name:'Tabata', groupPools:['mid','large']},
  circuit:{name:'Circuit / Stations', groupPools:['mid','large']},
  partner:{name:'Partner', groupPools:['four','mid','large']},
  fortime:{name:'For Time', groupPools:['solo','three']},
  wrt:{name:'Work / Rest / Trigger', groupPools:['three','four']},
};

// Tier scaling (index 0=30min .. 3=45min)
const TIER_LABELS = ['Easy','Moderate','Firm','Hard'];
const TIER_MINUTES = [30,35,40,45];
const TIER_MULT = [0.75, 0.9, 1.0, 1.2];
const TIER_COLOR = ['var(--green)','var(--yellow)','var(--orange)','var(--red)'];

function groupPool(size){
  if(size<=2) return 'solo';
  if(size===3) return 'three';
  if(size===4) return 'four';
  if(size>=5 && size<=8) return 'mid';
  return 'large';
}
function wrtEligible(size){ return [3,4,6,8,12].includes(size); }

function formatsForGroup(size){
  const pool = groupPool(size);
  let list = Object.keys(FORMATS).filter(f=>FORMATS[f].groupPools.includes(pool));
  if(!wrtEligible(size)) list = list.filter(f=>f!=='wrt');
  else if(!list.includes('wrt')) list.push('wrt');
  if(size % 2 !== 0) list = list.filter(f=>f!=='partner'); // partner needs even numbers — no odd-one-out trios
  return list;
}

/* =========================================================
   STATE / PERSISTENCE
   ========================================================= */
const LS_KEY = 'wodspinner_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    equipmentOff: [],           // equipment ids toggled OFF
    favouriteExerciseIds: [],
    customExercises: [],
    removedExerciseIds: [],
    favouriteWorkouts: [],      // saved whole workouts
    history: []                 // {ts, exerciseIds:[]}
  };
}
let STATE = loadState();
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
}

/* =========================================================
   GYM DATA (equipment + exercises — now from the database,
   not the old hardcoded EQUIPMENT/DEFAULT_EXERCISES arrays)
   ========================================================= */
let GYM_DATA = { loggedIn:false, equipment:[], exercises:[], favouriteExerciseIds:[] };
let GYM_DATA_READY = null;

function loadGymData(){
  GYM_DATA_READY = fetch('/api/gym-data')
    .then(r=>r.json())
    .then(data=>{
      GYM_DATA.loggedIn = !!data.loggedIn;
      GYM_DATA.equipment = data.equipment || [];
      GYM_DATA.exercises = data.exercises || [];
      GYM_DATA.favouriteExerciseIds = data.favouriteExerciseIds || [];
    })
    .catch(()=>{
      GYM_DATA.equipment = [];
      GYM_DATA.exercises = [];
      GYM_DATA.favouriteExerciseIds = [];
    });
  return GYM_DATA_READY;
}

/* =========================================================
   ONE-TIME IMPORT of pre-account local customizations
   (equipment toggles, custom exercises, hidden exercises,
   favourite exercises saved in this browser before login existed)
   ========================================================= */
const LEGACY_IMPORT_FLAG = 'wodspinner_legacy_imported_v1';

function hasLegacyDataToImport(){
  return STATE.equipmentOff.length>0 || STATE.customExercises.length>0
    || STATE.removedExerciseIds.length>0 || STATE.favouriteExerciseIds.length>0;
}
function legacyImportAlreadyHandled(){
  try{ return localStorage.getItem(LEGACY_IMPORT_FLAG) === '1'; }catch(e){ return true; }
}
function markLegacyImportHandled(){
  try{ localStorage.setItem(LEGACY_IMPORT_FLAG, '1'); }catch(e){}
}
function shouldShowImportBanner(){
  return ACCOUNT.loggedIn && !legacyImportAlreadyHandled() && hasLegacyDataToImport();
}

function renderImportBanner(){
  const el = document.getElementById('import-banner');
  if(!el) return;
  if(!shouldShowImportBanner()){ el.innerHTML=''; el.className=''; return; }
  el.className = 'ok';
  el.innerHTML = `
    <span>Found equipment/exercise customizations saved in this browser from before you signed in — import them to your account?</span>
    <span style="display:flex;gap:8px;flex-shrink:0;">
      <button onclick="runLegacyImport()">Import</button>
      <button onclick="skipLegacyImport()">Skip</button>
    </span>`;
}

async function runLegacyImport(){
  // best-effort, item by item — one bad/stale id (e.g. equipment that no
  // longer exists in the master list) shouldn't block the rest of the import
  for(const id of STATE.equipmentOff){
    try{
      await fetch('/api/my/equipment-off', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ equipmentId:id, off:true }),
      });
    }catch(e){}
  }
  for(const ex of STATE.customExercises){
    try{
      await fetch('/api/my/exercises', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name:ex.name, pattern:ex.pattern, equip:ex.equip, unit:ex.unit, base:ex.base }),
      });
    }catch(e){}
  }
  for(const id of STATE.removedExerciseIds){
    try{
      await fetch('/api/my/hidden-exercises', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ exerciseId:id, hidden:true }),
      });
    }catch(e){}
  }
  for(const id of STATE.favouriteExerciseIds){
    try{
      await fetch('/api/my/favourite-exercises', {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ exerciseId:id, favourite:true }),
      });
    }catch(e){}
  }
  markLegacyImportHandled();
  await loadGymData();
  renderImportBanner();
  render();
}

function skipLegacyImport(){
  markLegacyImportHandled();
  renderImportBanner();
}

function allExercises(){
  // exclude hidden ones here — this is what the generator uses. Settings
  // shows the unfiltered GYM_DATA.exercises directly so hidden items stay
  // visible (and un-hideable) rather than disappearing outright.
  return GYM_DATA.exercises.filter(e=>!e.hidden);
}
function equipmentAvailable(id){
  const eq = GYM_DATA.equipment.find(e=>e.id===id);
  return !!eq && !eq.off;
}
function exerciseUsable(ex){ return ex.equip.every(equipmentAvailable); }
function exerciseIsRotationOnly(ex){
  return ex.equip.some(id=>{
    const eq = GYM_DATA.equipment.find(e=>e.id===id);
    return eq && eq.rotationOnly;
  });
}

/* =========================================================
   GENERATION LOGIC
   ========================================================= */

let SERVER_RECENT_IDS = new Set();

async function refreshServerRecentHistory(){
  if(!ACCOUNT.loggedIn){ SERVER_RECENT_IDS = new Set(); return; }
  try{
    const resp = await fetch('/api/history/recent');
    const data = await resp.json();
    SERVER_RECENT_IDS = new Set(data.recentExerciseIds || []);
  }catch(e){
    SERVER_RECENT_IDS = new Set();
  }
}

function recentlyUsedIds(days){
  const cutoff = Date.now() - days*24*60*60*1000;
  // merge server-side history (personal, cross-device, already 7-day windowed
  // by the backend) with local STATE.history as a same-session fallback for
  // logged-out use or before the server fetch has completed
  const ids = new Set(SERVER_RECENT_IDS);
  STATE.history.filter(h=>h.ts>=cutoff).forEach(h=>h.exerciseIds.forEach(id=>ids.add(id)));
  return ids;
}

// Empty by default so normal generation everywhere else in the app is
// completely unaffected — only populated briefly around a Popular-screen
// generation call (see generateFourFromPopular), then cleared straight after.
let POPULAR_EXERCISE_NAMES = new Set();

function weightedPick(candidates, recentIds, usedThisWorkout){
  const weighted = [];
  candidates.forEach(ex=>{
    if(usedThisWorkout.has(ex.id)) return;
    let w = 1;
    if(GYM_DATA.favouriteExerciseIds.includes(ex.id)) w *= 2.2;
    if(recentIds.has(ex.id)) w *= 0.35;
    if(POPULAR_EXERCISE_NAMES.has(ex.name)) w *= 1.6;
    for(let i=0;i<Math.round(w*10);i++) weighted.push(ex);
  });
  if(weighted.length===0) return null;
  return weighted[Math.floor(Math.random()*weighted.length)];
}

// running-only movements — at most ONE of these should ever appear in a
// single generated workout, whether it's picked as a regular work station or
// as the WRT trigger. Farmer's carry / sled push-pull are excluded — they're
// loaded carries/pushes, not runs, so they don't compete for this slot.
const RUN_TYPE_IDS = new Set(['shuttle_runs','blue_mat_run','h145_run']);

function pickExercisesForSession(format, groupSize, tierIdx, count){
  let usable = allExercises().filter(exerciseUsable);
  // Shuttle runs aren't flagged as a trigger-only exercise (they stay close
  // to the group, unlike a point-to-point run), but they were still ending
  // up as a regular WRT station — taking someone off to the hangar with no
  // trigger-swap logic to cover for them. Simplest fix: just keep them out
  // of WRT entirely rather than reclassifying them.
  if(format==='wrt') usable = usable.filter(ex=>ex.id!=='shuttle_runs');
  const rotationOk = format==='circuit' || format==='wrt' || groupSize<=2;
  const pool = rotationOk ? usable : usable.filter(ex=>!exerciseIsRotationOnly(ex));
  const triggerPool = usable.filter(ex=>ex.trigger);
  // Trigger-flagged exercises (runs, sled pushes/pulls, farmer's carries —
  // anything that takes someone out of the gym into open space) must never
  // be a regular work station, in WRT or any other format. If one ended up
  // as a station too, that person wouldn't be there when the trigger runner
  // gets back to swap the rotation.
  const mainPool = pool.filter(ex=>!ex.trigger);

  const recentIds = recentlyUsedIds(7);
  const patternCounts = {};
  const chosen = [];
  const usedThisWorkout = new Set();
  const hasRunType = ()=> chosen.some(c=>RUN_TYPE_IDS.has(c.id));

  // primary pass: enforce pattern diversity (max 2/pattern) and at least one cardio
  let attempts = 0;
  while(chosen.length < count && attempts < count*12){
    attempts++;
    const needsCardio = chosen.length===0 || (!chosen.some(c=>c.pattern==='cardio') && chosen.length===count-1);
    let candidates = mainPool.filter(ex=>{
      const pc = patternCounts[ex.pattern]||0;
      if(pc>=2) return false;
      if(needsCardio && ex.pattern!=='cardio') return false;
      if(RUN_TYPE_IDS.has(ex.id) && hasRunType()) return false;
      return true;
    });
    if(candidates.length===0) candidates = mainPool.filter(ex=>(patternCounts[ex.pattern]||0)<2 && !(RUN_TYPE_IDS.has(ex.id) && hasRunType()));
    const pick = weightedPick(candidates, recentIds, usedThisWorkout);
    if(!pick) break;
    chosen.push(pick);
    usedThisWorkout.add(pick.id);
    patternCounts[pick.pattern] = (patternCounts[pick.pattern]||0)+1;
  }

  // fallback pass: guarantee the exact requested count so blocks/stations always
  // match the number of exercises shown. Relaxes the pattern cap first (reusing
  // unused exercises), then allows repeats if the equipment pool is genuinely thin.
  // Still respects the one-run-type rule throughout.
  let guard = 0;
  while(chosen.length < count && mainPool.length > 0 && guard < 50){
    guard++;
    const allowed = mainPool.filter(ex=>!(RUN_TYPE_IDS.has(ex.id) && hasRunType()));
    const unused = allowed.filter(ex=>!usedThisWorkout.has(ex.id));
    const source = unused.length ? unused : allowed;
    if(source.length===0) break;
    const pick = weightedPick(source, recentIds, new Set());
    if(!pick) break;
    chosen.push(pick);
    usedThisWorkout.add(pick.id);
  }
  return {chosen, triggerPool};
}

function scaledAmount(ex, tierIdx){
  const mult = TIER_MULT[tierIdx];
  if(ex.unit==='reps') return Math.max(4, Math.round(ex.base*mult/2)*2);
  if(ex.unit==='cal') return Math.max(5, Math.round(ex.base*mult));
  if(ex.unit==='time') return Math.max(15, Math.round(ex.base*mult/5)*5);
  if(ex.unit==='distance') return Math.max(10, Math.round(ex.base*mult/5)*5);
  // 'note' exercises (e.g. Blue Mat run) represent one fixed-distance lap by
  // definition — base is 0, there's nothing to scale. When one of these shows
  // up as a regular WRT work station rather than the designated trigger, the
  // sensible target is how many times you run it, not a distance figure.
  if(ex.unit==='note') return Math.max(2, Math.round(3*mult));
  return null;
}
function amountLabel(ex, tierIdx){
  const amt = scaledAmount(ex, tierIdx);
  const suffix = ex.unilateral ? ' each side' : '';
  if(ex.unit==='reps') return amt+' reps'+suffix;
  if(ex.unit==='cal') return amt+' cal';
  if(ex.unit==='time') return amt+'s'+suffix;
  if(ex.unit==='distance') return amt+'m';
  if(ex.unit==='note') return amt+' reps';
  // Anything else reaching here (e.g. a custom exercise with an unrecognised
  // unit) falls back to a reps-style number rather than going blank.
  if(!ex.trigger && ex.base>0) return Math.max(4, Math.round(ex.base*(TIER_MULT[tierIdx]||1)/2)*2)+' reps'+suffix;
  return '';
}

// WRT works through one exercise at a time — the whole group rotates through
// work/rest/trigger roles on it until a TOTAL is collectively completed,
// then moves on to the next exercise. That's a fundamentally different
// number to the "per round" target every other format uses: it needs to
// represent the full accumulated amount for that exercise's whole time
// slice, not one short burst. ex.base is treated as roughly "how much in
// ~75s of continuous work" (the same anchor the per-round scaling already
// implicitly uses), scaled up to however long this exercise's slice of the
// total workout actually is.
function wrtTotalAmountLabel(ex, tierIdx, stationCount){
  const stationSeconds = (TIER_MINUTES[tierIdx]*60) / stationCount;
  const REFERENCE_SECONDS = 75;
  const mult = TIER_MULT[tierIdx];
  const raw = (ex.base * mult / REFERENCE_SECONDS) * stationSeconds;
  const suffix = ex.unilateral ? ' each side' : '';
  if(ex.unit==='cal') return Math.max(10, Math.round(raw/5)*5)+' cal';
  if(ex.unit==='time') return Math.max(30, Math.round(raw/10)*10)+'s'+suffix;
  return Math.max(10, Math.round(raw/5)*5)+' reps'+suffix;
}

// ---- circuit timing: one shared, deterministic source of truth ----
// work+rest always sums to exactly 60s per tier by design, so given a station
// count, the round count that best hits the tier's target duration can be
// solved directly rather than guessed — and since every place that needs
// rounds calls this same pure function with the same (tierIdx, stations)
// inputs, it can never drift out of sync with what's actually displayed.
function circuitWorkRest(tierIdx){
  return {work:[30,35,40,45][tierIdx], rest:[30,25,20,15][tierIdx]};
}
function circuitRoundsFor(tierIdx, stations){
  const {work, rest} = circuitWorkRest(tierIdx);
  const targetSec = TIER_MINUTES[tierIdx]*60;
  return Math.max(2, Math.round(targetSec/(stations*(work+rest))));
}
// picks the station count (>= groupSize, ideally close to it) that gets the
// resulting rounds*stations*cycle time closest to the tier's target duration
// Searching only 3 station counts beyond the minimum was too narrow — for
// some group sizes there was no good time-fit available in that tiny range,
// producing up to 8.3% drift from the stated duration. Widening the search
// fixes that, but taken too far it starts "fixing" a minor drift by adding
// a pile of entirely unused spare stations (e.g. 11 people on 20 stations),
// which is worse for an actual gym floor than a couple of minutes' drift.
// The cost function below balances both: minutes of drift and spare
// stations are weighted equally, so it won't trade one for an excess of
// the other.
function pickCircuitStations(tierIdx, groupSize){
  const baseStations = [4,5,5,6][tierIdx];
  const minStations = Math.max(baseStations, groupSize);
  const {work, rest} = circuitWorkRest(tierIdx);
  const targetSec = TIER_MINUTES[tierIdx]*60;
  const SEARCH_WIDTH = 12;
  const SPARE_PENALTY = 1; // 1 percentage point of drift treated as equally costly to 1 empty station
  let best = null;
  for(let stations=minStations; stations<=minStations+SEARCH_WIDTH; stations++){
    const rounds = circuitRoundsFor(tierIdx, stations);
    const total = rounds*stations*(work+rest) - rest; // minus the final trailing rest, which gets skipped
    const driftPct = Math.abs(total-targetSec)/targetSec*100;
    const spare = stations - groupSize;
    const cost = driftPct + spare*SPARE_PENALTY;
    if(!best || cost<best.cost) best = {stations, cost};
  }
  return best.stations;
}

// how many exercises/stations/blocks each format wants for a given tier —
// the single source of truth so the count shown always matches what's listed
function requestedExerciseCount(format, tierIdx, groupSize){
  switch(format){
    // circuit stations: solved jointly with rounds to hit the tier's target
    // duration, never fewer than the number of people.
    case 'circuit': return pickCircuitStations(tierIdx, groupSize);
    case 'wrt': return [4,5,5,6][tierIdx];
    case 'tabata': return [4,5,6,7][tierIdx];
    case 'emom': return [3,4,4,5][tierIdx];
    case 'partner': return [4,4,5,5][tierIdx];
    case 'amrap': return [4,5,5,6][tierIdx];
    case 'fortime': return [4,5,6,6][tierIdx];
    default: return 5;
  }
}

// n = the ACTUAL number of exercises chosen (always == requestedExerciseCount,
// but built from it explicitly so structure text can never drift out of sync)
function buildStructureText(format, tierIdx, n){
  const min = TIER_MINUTES[tierIdx];
  switch(format){
    case 'amrap':{
      const blocks = tierIdx<2?2:3;
      const per = [12,14,11,13][tierIdx];
      const rest = [3,2,2,1.5][tierIdx];
      return `${blocks} x ${per} min AMRAP, ${rest} min rest between`;
    }
    case 'emom':{
      const cycles = (min/n).toFixed(1).replace(/\.0$/,'');
      return `${min} min EMOM &middot; ${n} exercises on loop, 1 min each (~${cycles} laps)`;
    }
    case 'tabata':{
      const restArr=[90,90,60,45];
      return `${n} blocks x (20s work / 10s rest x8), ${restArr[tierIdx]}s rest between blocks`;
    }
    case 'circuit':{
      const rounds = circuitRoundsFor(tierIdx, n);
      const {work, rest} = circuitWorkRest(tierIdx);
      return `${n} stations, ${rounds} rounds, ${work}s work / ${rest}s rest`;
    }
    case 'partner':{
      const rounds=[3,4,4,5][tierIdx];
      return `${rounds} rounds, split work with your partner`;
    }
    case 'fortime':{
      return `For time \u2014 rest as needed, ${min}-min cap`;
    }
    case 'wrt':{
      return `Teams rotate: one works, one rests, one runs the trigger`;
    }
  }
  return '';
}

// splits a group as evenly as possible into `stations` clusters, e.g. 7 into 4 -> [2,2,2,1]
function stationGroups(groupSize, stations){
  const base = Math.floor(groupSize/stations);
  const rem = groupSize % stations;
  const groups = [];
  for(let i=0;i<stations;i++) groups.push(base + (i<rem?1:0));
  return groups.filter(g=>g>0);
}

// explains HOW a group actually moves through the format — short version for
// the card footer, longer version for the full-screen instruction notice
function buildGroupingNote(w){
  const n = w.exercises.length;
  switch(w.format){
    case 'circuit':{
      if(n >= w.groupSize){
        const spare = n - w.groupSize;
        return {
          short: spare>0 ? `1 person/station (${spare} spare)` : `1 person per station`,
          detail: `Every person gets their own station to start${spare>0?` \u2014 there ${spare===1?'is':'are'} ${spare} extra station${spare===1?'':'s'} beyond what's needed, so no one's ever waiting on someone else to finish.`:', so no one waits on anyone else.'} Rotate to the next station at the end of every round.`
        };
      }
      const groups = stationGroups(w.groupSize, n);
      return {
        short: `${groups.length} groups (${groups.join('/')}) rotating`,
        detail: `Split into ${groups.length} groups of ${groups.join('/')} people, one group per station to start. At the end of every round, each group moves to the next station, until everyone has hit all ${groups.length} stations.`
      };
    }
    case 'partner':{
      const pairs = Math.floor(w.groupSize/2);
      const leftover = w.groupSize%2;
      const short = leftover ? `${pairs} pairs + 1 trio` : `${pairs} pairs`;
      return {
        short,
        detail: `Pair up${leftover?` \u2014 ${pairs} pairs, plus one team of three`:''}. One partner works the current exercise while the other rests; swap every round.${leftover?' The trio rotates three-way: work / rest / rest.':''}`
      };
    }
    case 'emom':{
      const cycles = (w.duration/n).toFixed(1).replace(/\.0$/,'');
      return {
        short: `${n} exercises on loop`,
        detail: `Everyone does the same exercise together, one exercise per minute, looping back to the top of the list once you reach the end \u2014 about ${cycles} laps across the ${w.duration} minutes.`
      };
    }
    case 'tabata':{
      return {
        short: `${n} exercises, one per block`,
        detail: `Each block is one exercise, worked by everyone at once: 20s on / 10s off, x8. With more blocks than exercises the list repeats from the top. The 10s gap is for resetting position, not queuing for kit \u2014 every exercise here is bodyweight or personal-equipment so nobody's sharing a station.`
      };
    }
    case 'amrap':{
      return { short:'Everyone works together', detail:'Everyone moves through the exercise list together each block, completing as many rounds as possible before the block ends.' };
    }
    case 'fortime':{
      return { short:'Self-paced, rest as needed', detail:'Everyone completes the full exercise list for the stated reps at their own pace \u2014 break up sets and rest whenever needed. The time cap is a backstop, not a target; most groups finish well inside it.' };
    }
    case 'wrt':{
      const teamsPhrase = w.numTeams>1 ? `${w.numTeams} teams of ${w.teamSize}` : `Team of ${w.teamSize}`;
      const parallelNote = w.numTeams>1 ? ', running in parallel \u2014 assign each team a different starting station and swap at the halfway point (Round 1 / Round 2) so nobody queues for the same kit.' : '.';
      if(w.teamSize===4){
        return {
          short: teamsPhrase,
          detail: `${teamsPhrase}${parallelNote} Four roles rotate every cycle: one works the current station, one holds the core role (${w.coreRoleExercise}), one rests, one runs the trigger exercise (${w.trigger}). When the trigger returns: runner rests, rester takes the core role, core role moves to the station, worker becomes the runner.`
        };
      }
      return {
        short: teamsPhrase,
        detail: `${teamsPhrase}${parallelNote} One person works the current station, one rests, one runs the trigger exercise (${w.trigger}). When the trigger returns: runner rests, rester takes the station, worker becomes the runner.`
      };
    }
  }
  return {short:'', detail:''};
}

function pickTeamSize(groupSize){
  const opts=[];
  if(groupSize%3===0) opts.push(3);
  if(groupSize%4===0) opts.push(4);
  if(opts.length===0) return null;
  return opts[Math.floor(Math.random()*opts.length)];
}
// equipment that only exists as a single unit — fine for one team's trigger,
// but can't be the trigger for MULTIPLE teams running in parallel, since only
// one team could physically use it at a time
const SCARCE_SINGLE_EQUIP = new Set(['sled','vest','sandbag']);

function pickTrigger(triggerPool, tierIdx, numTeams, excludeRunTypes){
  let pool = triggerPool;
  if(numTeams>1){
    const spareEnough = pool.filter(t=>!t.equip.some(e=>SCARCE_SINGLE_EQUIP.has(e)));
    if(spareEnough.length>0) pool = spareEnough;
  }
  if(excludeRunTypes){
    const noRun = pool.filter(t=>!RUN_TYPE_IDS.has(t.id));
    if(noRun.length>0) pool = noRun;
  }
  if(pool.length===0) return null;
  const preferHard = tierIdx>=2;
  const hard = pool.filter(t=>t.id==='h145_run'||t.id==='sled_push'||t.id==='sled_pull');
  const easy = pool.filter(t=>t.id==='blue_mat_run'||t.id==='farmers_carry');
  const list = preferHard && hard.length ? hard : (easy.length?easy:pool);
  return list[Math.floor(Math.random()*list.length)];
}

function generateWorkout(format, groupSize, tierIdx){
  const requestedCount = requestedExerciseCount(format, tierIdx, groupSize);
  const {chosen, triggerPool} = pickExercisesForSession(format, groupSize, tierIdx, requestedCount);

  const workout = {
    id: 'w'+Date.now()+'_'+Math.floor(Math.random()*9999),
    format, groupSize, tierIdx,
    duration: TIER_MINUTES[tierIdx],
    exercises: chosen.map(ex=>({id:ex.id, name:ex.name, pattern:ex.pattern, unit:ex.unit, cue:ex.cue||'', intensity:ex.intensity||2, amountLabel: amountLabel(ex,tierIdx)})),
    createdAt: Date.now(),
  };

  // Tabata and Circuit are governed entirely by the block/station timer — you
  // work the clock, not a rep target, regardless of whether the exercise is
  // normally reps/cal/time-based. Showing any scaled number here implies a
  // required target that doesn't actually exist, so drop it for everything.
  if(format==='tabata' || format==='circuit'){
    workout.exercises = workout.exercises.map(e=>({...e, amountLabel:''}));
  }

  if(format==='wrt'){
    const teamSize = pickTeamSize(groupSize) || 3;
    const numTeams = Math.floor(groupSize/teamSize);
    const workHasRunType = workout.exercises.some(e=>RUN_TYPE_IDS.has(e.id));
    const trig = pickTrigger(triggerPool, tierIdx, numTeams, workHasRunType)
      || (workHasRunType ? allExercises().find(e=>e.id==='farmers_carry') : allExercises().find(e=>e.id==='blue_mat_run'))
      || allExercises().find(e=>e.id==='blue_mat_run');
    workout.teamSize = teamSize;
    workout.numTeams = numTeams;
    workout.trigger = trig.name;
    workout.roundSwap = numTeams>1;
    // Each work station's target is the TOTAL for its whole time slice
    // (see wrtTotalAmountLabel above), not a single round's amount — this is
    // what tells the group roughly how much they need to rack up between
    // them before moving to the next exercise. `chosen` still has the full
    // exercise objects (base, etc) that workout.exercises was trimmed from.
    workout.exercises = chosen.map(ex=>({
      id:ex.id, name:ex.name, pattern:ex.pattern, unit:ex.unit, cue:ex.cue||'', intensity:ex.intensity||2,
      amountLabel: wrtTotalAmountLabel(ex, tierIdx, chosen.length),
    }));
    // the trigger exercise runs every rotation but was previously only
    // mentioned in the instructions, never actually listed — add it as its
    // own row so it shows up alongside the work stations
    workout.exercises.push({
      id: trig.id, name: trig.name, pattern: trig.pattern, unit: trig.unit,
      cue: trig.cue || '', intensity: trig.intensity||2, amountLabel: 'Every rotation', isTrigger: true
    });
    // teams of 4 get a fourth concurrent role — work / core / rest / trigger —
    // not just work / rest / trigger. Add a dedicated core-role exercise,
    // separate from the rotating work stations, same treatment as the trigger.
    if(teamSize===4){
      const usableCore = allExercises().filter(ex=>ex.pattern==='core' && exerciseUsable(ex) && !ex.trigger);
      const notAlreadyUsed = usableCore.filter(ex=>!workout.exercises.some(w=>w.id===ex.id));
      const corePool = notAlreadyUsed.length ? notAlreadyUsed : usableCore;
      const coreEx = corePool.length ? corePool[Math.floor(Math.random()*corePool.length)] : allExercises().find(e=>e.id==='plank');
      workout.coreRoleExercise = coreEx.name;
      workout.exercises.push({
        id: coreEx.id, name: coreEx.name, pattern: coreEx.pattern, unit: coreEx.unit,
        cue: coreEx.cue || '', intensity: coreEx.intensity||2,
        amountLabel: coreEx.unit==='time' ? 'Continuous' : 'Every rotation',
        isCoreRole: true
      });
    }
  }

  // built AFTER exercises (and, for wrt, team info) are finalised, so the
  // block/station count and grouping notes always match what's actually shown
  workout.structure = buildStructureText(format, tierIdx, workout.exercises.length);
  workout.grouping = buildGroupingNote(workout);
  return workout;
}

// ---- composite difficulty scoring ----
// Measures each candidate's ACTUAL demand rather than trusting which preset
// tier it was generated from. Three signals:
//  1. work ratio — fraction of total time actually spent working (not resting)
//  2. average exercise intensity — 1-3 tag per exercise, physical demand
//  3. actual duration — longer sessions accumulate more fatigue (light weight,
//     since duration alone is exactly the unreliable signal this replaces)
function candidateDifficultyScore(w){
  let workRatio, actualSeconds;
  if(['amrap','emom','tabata','circuit'].includes(w.format)){
    const prog = buildTimerProgram(w);
    const workSec = prog.phases.filter(p=>p.kind==='work').reduce((s,p)=>s+p.seconds,0);
    const totalSec = prog.phases.reduce((s,p)=>s+p.seconds,0);
    workRatio = totalSec>0 ? workSec/totalSec : 1;
    actualSeconds = totalSec;
  } else if(w.format==='wrt'){
    // each person only works one rotation slot in teamSize — genuinely less
    // individual work time than it looks like from the exercise list alone
    workRatio = 1/w.teamSize;
    actualSeconds = w.duration*60;
  } else if(w.format==='partner'){
    workRatio = 0.5; // work is split with a partner
    actualSeconds = w.duration*60;
  } else {
    workRatio = 0.85; // for time: self-paced but close to continuous
    actualSeconds = w.duration*60;
  }
  const avgIntensity = w.exercises.reduce((s,e)=>s+(e.intensity||2),0) / Math.max(1,w.exercises.length);
  const intensityNorm = (avgIntensity-1)/2; // 1-3 scale -> 0-1
  const durationNorm = Math.min(actualSeconds/(50*60), 1); // cap contribution around 50min
  w._actualSeconds = actualSeconds;
  return 0.5*workRatio + 0.35*intensityNorm + 0.15*durationNorm;
}

// picks k candidates spread across the sorted (ascending difficulty) pool —
// slicing into k sequential buckets guarantees non-decreasing difficulty by
// construction, then prefers format variety within each bucket
function pickSpread(sorted, k){
  const n = sorted.length;
  const bucketSize = Math.max(1, Math.floor(n/k));
  const picks = [];
  const usedFormats = new Set();
  for(let i=0;i<k;i++){
    const start = i*bucketSize;
    const end = (i===k-1) ? n : Math.min(n, start+bucketSize);
    let bucket = sorted.slice(start, end);
    if(bucket.length===0) bucket = [sorted[Math.min(n-1, start)]];
    let choices = bucket.filter(w=>!usedFormats.has(w.format));
    if(choices.length===0) choices = bucket;
    const pick = choices[Math.floor(Math.random()*choices.length)];
    usedFormats.add(pick.format);
    picks.push(pick);
  }
  return picks;
}

function generateFour(groupSize){
  const pool = formatsForGroup(groupSize);
  const candidates = [];
  pool.forEach(format=>{
    for(let presetTier=0; presetTier<4; presetTier++){
      const w = generateWorkout(format, groupSize, presetTier);
      w._score = candidateDifficultyScore(w);
      candidates.push(w);
    }
  });
  candidates.sort((a,b)=>a._score-b._score);
  const picks = pickSpread(candidates, 4);
  // displayTier = rank position (0-3), independent of the preset tier that
  // was used to build the numbers — that preset stays on w.tierIdx untouched,
  // so the timer/structure text (already computed) never gets recalculated
  // against a mismatched tier.
  picks.forEach((w,i)=>{
    w.displayTier = i;
    w.duration = Math.round((w._actualSeconds||w.duration*60)/60);
  });
  return picks;
}

// Same as generateFour, but restricted to a specific set of formats (used by
// the Popular screen to draw from the top few most-used formats rather than
// every eligible one). Falls back to the full eligible pool if none of the
// requested formats actually work for this group size, so it never comes up empty.
function generateFourFromFormats(groupSize, allowedFormats){
  const eligible = formatsForGroup(groupSize);
  let pool = eligible.filter(f=>allowedFormats.includes(f));
  if(pool.length===0) pool = eligible;
  const candidates = [];
  pool.forEach(format=>{
    for(let presetTier=0; presetTier<4; presetTier++){
      const w = generateWorkout(format, groupSize, presetTier);
      w._score = candidateDifficultyScore(w);
      candidates.push(w);
    }
  });
  candidates.sort((a,b)=>a._score-b._score);
  const picks = pickSpread(candidates, 4);
  picks.forEach((w,i)=>{
    w.displayTier = i;
    w.duration = Math.round((w._actualSeconds||w.duration*60)/60);
  });
  return picks;
}

function recordHistory(workout){
  STATE.history.push({ts:Date.now(), exerciseIds:workout.exercises.map(e=>e.id)});
  // keep last 60 days only
  const cutoff = Date.now()-60*24*60*60*1000;
  STATE.history = STATE.history.filter(h=>h.ts>=cutoff);
  saveState();
}

/* =========================================================
   TIMER
   ========================================================= */

// Builds a sequence of phases {label, seconds, kind:'work'|'rest'|'lead'} for
// formats where the generator already defines per-exercise timing (amrap,
// emom, tabata, circuit). Other formats (partner, fortime, wrt) don't have
// enough structure defined to auto-derive sub-intervals, so they get a single
// simple countdown of the full session length instead.
function buildTimerProgram(w){
  const ex = w.exercises;
  const n = ex.length;
  const phases = [];

  if(w.format==='amrap'){
    const blocks = w.tierIdx<2?2:3;
    const per = [12,14,11,13][w.tierIdx];
    const rest = [3,2,2,1.5][w.tierIdx];
    for(let b=0;b<blocks;b++){
      phases.push({label:`AMRAP \u2014 block ${b+1} of ${blocks}`, seconds:per*60, kind:'work'});
      if(b<blocks-1) phases.push({label:'Rest', seconds:Math.round(rest*60), kind:'rest'});
    }
    return {mode:'intervals', phases};
  }

  if(w.format==='emom'){
    for(let m=0;m<w.duration;m++){
      const exr = ex[m%n];
      phases.push({label:`Minute ${m+1} \u2014 ${exr.name}`, seconds:60, kind:'work'});
    }
    return {mode:'intervals', phases};
  }

  if(w.format==='tabata'){
    const restBetween = [90,90,60,45][w.tierIdx];
    for(let b=0;b<n;b++){
      for(let r=0;r<8;r++){
        phases.push({label:`${ex[b].name} \u2014 round ${r+1}/8`, seconds:20, kind:'work'});
        if(!(b===n-1 && r===7)) phases.push({label:'Rest', seconds:10, kind:'rest'});
      }
      if(b<n-1) phases.push({label:'Rest between blocks', seconds:restBetween, kind:'rest'});
    }
    return {mode:'intervals', phases};
  }

  if(w.format==='circuit'){
    const rounds = circuitRoundsFor(w.tierIdx, n);
    const {work, rest} = circuitWorkRest(w.tierIdx);
    for(let r=0;r<rounds;r++){
      for(let s=0;s<n;s++){
        phases.push({label:`${ex[s].name} \u2014 round ${r+1}/${rounds}`, seconds:work, kind:'work'});
        const isLast = (r===rounds-1 && s===n-1);
        if(!isLast) phases.push({label:'Rest / rotate', seconds:rest, kind:'rest'});
      }
    }
    return {mode:'intervals', phases};
  }

  // partner / fortime / wrt: no per-exercise timing defined yet — simple countdown
  return {mode:'simple', phases:[{label:FORMATS[w.format].name, seconds:w.duration*60, kind:'work'}]};
}

let TIMER = null; // {program, phaseIndex, remaining, running, endTs, warned, tickHandle}

function clearTimerInterval(){
  if(TIMER && TIMER.tickHandle){ clearInterval(TIMER.tickHandle); TIMER.tickHandle=null; }
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  return audioCtx;
}
function beep(freq, durMs, vol, waveform){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = waveform || 'sine';
    osc.frequency.value = freq;
    const now = ctx.currentTime;
    const dur = durMs/1000;
    // quick fade in/out avoids clicky edges, especially on the square wave
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol, now+0.012);
    gain.gain.setValueAtTime(vol, now+Math.max(0.02, dur-0.04));
    gain.gain.linearRampToValueAtTime(0, now+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now+dur);
  }catch(e){}
}
function playWarnBeep(){ beep(650,210,0.4,'triangle'); }           // 3-2-1 countdown bip
function playIntervalEndBeep(){ beep(650,720,0.4,'triangle'); }    // normal phase-transition beep

// A short, cheerful ascending run for the very end of the whole workout —
// plays instead of the normal single transition beep, timed to land right
// as the celebration modal appears. Each note is {freq, dur, start} in Hz/ms,
// scheduled from the moment the melody starts (t=0).
const CELEBRATION_MELODY = [
  { freq: 523,  dur: 130,  start: 0    }, // C5
  { freq: 659,  dur: 130,  start: 140  }, // E5
  { freq: 784,  dur: 130,  start: 280  }, // G5
  { freq: 1047, dur: 150,  start: 420  }, // C6
  { freq: 784,  dur: 110,  start: 590  }, // G5 (little bounce back down)
  { freq: 1047, dur: 130,  start: 720  }, // C6
  { freq: 1319, dur: 130,  start: 870  }, // E6
  { freq: 1568, dur: 1020, start: 1020 }, // G6 — held, triumphant finish
];
function playCelebrationMelody(){
  CELEBRATION_MELODY.forEach(note=>{
    setTimeout(()=>beep(note.freq, note.dur, 0.4, 'triangle'), note.start);
  });
}

// duck Spotify playback under the 3-2-1 warning beeps + transition beep so
// they're actually audible over music, then restore normal volume shortly after
function spotifyDuck(){
  if(!SPOTIFY.player || SPOTIFY.ducked) return;
  SPOTIFY.ducked = true;
  try{ SPOTIFY.player.setVolume(0.06); }catch(e){}
}
function spotifyUnduck(){
  if(!SPOTIFY.player) return;
  SPOTIFY.ducked = false;
  try{ SPOTIFY.player.setVolume(SPOTIFY.volume!=null?SPOTIFY.volume:0.7); }catch(e){}
}

function initTimer(workout){
  clearTimerInterval();
  const program = buildTimerProgram(workout);
  TIMER = {
    program,
    format: workout.format,
    phaseIndex:0,
    remaining:program.phases[0].seconds,
    running:false,
    endTs:null,
    warned:new Set(),
    tickHandle:null,
    historyLogged:false, // only log to history once per session, on the FIRST Start press — not on every resume after Pause
    historyId:null,      // the workout_history row id, filled in once the Start-triggered log call resolves
    feedbackSubmitted:false,
  };
  renderTimerPanel();
  closeCelebration(); // a fresh workout shouldn't carry over a modal from a previous one on the same screen
}

function timerTotalPhases(){ return TIMER ? TIMER.program.phases.length : 0; }

// logged on Start (not just opening a card) — and applies the same whether
// the workout was freshly generated or loaded from Favourites, since Start
// is the one moment that actually means "we did this," not just "we looked at it"
async function logWorkoutHistory(workout){
  if(!ACCOUNT.loggedIn || !workout) return null;
  const displayTier = (workout.displayTier!==undefined) ? workout.displayTier : workout.tierIdx;
  try{
    const resp = await fetch('/api/history', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        groupSize: workout.groupSize,
        format: workout.format,
        tierLabel: TIER_LABELS[displayTier] || null,
        workout: workout,
      }),
    });
    const data = await resp.json();
    return data.id || null;
  }catch(e){ return null; /* history logging is best-effort — never block the workout on it */ }
}

function timerStart(){
  if(!TIMER) return;
  getAudioCtx(); // unlock audio on user gesture
  if(TIMER.running) return;
  if(!TIMER.historyLogged){
    TIMER.historyLogged = true;
    const timerRef = TIMER; // capture in case a different timer replaces the module-level TIMER before this resolves
    logWorkoutHistory(APP.selected).then(id=>{ if(id) timerRef.historyId = id; });
  }
  TIMER.running = true;
  TIMER.endTs = Date.now() + TIMER.remaining*1000;
  TIMER.tickHandle = setInterval(timerTick, 200);
  updateTimerButtons();
}
function timerPause(){
  if(!TIMER || !TIMER.running) return;
  TIMER.remaining = Math.max(0, Math.ceil((TIMER.endTs - Date.now())/1000));
  clearTimerInterval();
  TIMER.running = false;
  updateTimerButtons();
}
function timerResetTo(phaseIdx){
  if(!TIMER) return;
  clearTimerInterval();
  TIMER.phaseIndex = phaseIdx;
  TIMER.remaining = TIMER.program.phases[phaseIdx].seconds;
  TIMER.running = false;
  TIMER.endTs = null;
  TIMER.warned = new Set();
  renderTimerPanel();
  closeCelebration(); // resetting means the session isn't "done" anymore
}
function timerReset(){ timerResetTo(0); }

function timerTick(){
  if(!TIMER || !TIMER.running) return;
  const remainingMs = TIMER.endTs - Date.now();
  const remaining = Math.max(0, Math.ceil(remainingMs/1000));
  if(remaining!==TIMER.remaining){
    TIMER.remaining = remaining;
    // duck a second before the first bip actually plays, since Spotify's
    // volume change isn't instantaneous — ducking at the same moment as the
    // beep meant the first one or two still played over full-volume music
    if(remaining===4 && !TIMER.warned.has('duck')){
      TIMER.warned.add('duck');
      spotifyDuck();
    }
    if(remaining<=3 && remaining>0 && !TIMER.warned.has(remaining)){
      TIMER.warned.add(remaining);
      playWarnBeep();
    }
  }
  if(remainingMs<=0){
    const nextIdx = TIMER.phaseIndex+1;
    const isWorkoutComplete = nextIdx >= TIMER.program.phases.length;
    if(isWorkoutComplete) playCelebrationMelody();
    else playIntervalEndBeep();
    spotifyDuck(); // covers phases shorter than 4s where the early duck never fired
    // give the melody room to actually finish before restoring music volume;
    // the normal single beep only needs the usual short buffer
    setTimeout(spotifyUnduck, isWorkoutComplete ? 2100 : 900);
    if(isWorkoutComplete){
      // workout complete
      clearTimerInterval();
      TIMER.running = false;
      TIMER.phaseIndex = TIMER.program.phases.length-1;
      TIMER.remaining = 0;
      updateTimerDisplay();
      updateTimerButtons();
      showCelebration();
      return;
    }
    TIMER.phaseIndex = nextIdx;
    TIMER.remaining = TIMER.program.phases[nextIdx].seconds;
    TIMER.warned = new Set();
    TIMER.endTs = Date.now() + TIMER.remaining*1000;
  }
  updateTimerDisplay();
}

function fmtClock(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function timerTotalRemaining(){
  if(!TIMER) return 0;
  let total = TIMER.remaining;
  for(let i=TIMER.phaseIndex+1;i<TIMER.program.phases.length;i++) total += TIMER.program.phases[i].seconds;
  return total;
}
function updateTimerDisplay(){
  if(!TIMER) return;
  const disp = document.getElementById('timer-display');
  const phaseEl = document.getElementById('timer-phase');
  const metaEl = document.getElementById('timer-meta');
  const totalEl = document.getElementById('timer-total');
  if(!disp) return;
  const phase = TIMER.program.phases[TIMER.phaseIndex];
  disp.textContent = fmtClock(TIMER.remaining);
  disp.classList.toggle('warn', TIMER.remaining<=3 && TIMER.remaining>0 && TIMER.running);
  phaseEl.textContent = phase.label + (phase.kind==='rest' ? ' \u2014 REST' : '');
  if(TIMER.program.mode==='intervals'){
    metaEl.textContent = `Phase ${TIMER.phaseIndex+1} of ${timerTotalPhases()}`;
    if(totalEl) totalEl.textContent = `Total time left: ${fmtClock(timerTotalRemaining())}`;
  } else {
    metaEl.textContent = TIMER.remaining===0 ? 'Time\u2019s up' : (TIMER.format==='fortime' ? 'Time cap \u2014 rest as needed, beat the clock' : 'Total session countdown');
    if(totalEl) totalEl.textContent = '';
  }
}
function updateTimerButtons(){
  const startBtn = document.getElementById('timer-start-btn');
  const pauseBtn = document.getElementById('timer-pause-btn');
  if(!startBtn) return;
  startBtn.disabled = !!(TIMER && TIMER.running);
  startBtn.textContent = (TIMER && TIMER.remaining===0 && TIMER.phaseIndex===TIMER.program.phases.length-1 && !TIMER.running) ? 'Done' : 'Start';
  pauseBtn.disabled = !(TIMER && TIMER.running);
}
function renderTimerPanel(){
  updateTimerDisplay();
  updateTimerButtons();
}

// Builds a one-off burst of randomised falling confetti pieces as raw HTML —
// pure CSS animation, no JS timers needed to drive it, so it costs nothing
// once rendered and needs no cleanup beyond clearing the container.
function buildConfettiHtml(){
  const colors = ['#f5c518','#4caf7d','#e0483e','#f0913a','#ffffff'];
  let html = '';
  for(let i=0;i<70;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*0.4).toFixed(2);
    const duration = (1.8 + Math.random()*1.2).toFixed(2);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const rot = Math.round(360 + Math.random()*540);
    const w = (6 + Math.random()*6).toFixed(0);
    const h = (w*1.6).toFixed(0);
    html += `<div class="confetti-piece" style="left:${left}%;background:${color};width:${w}px;height:${h}px;animation-delay:${delay}s;animation-duration:${duration}s;--rot:${rot}deg;"></div>`;
  }
  return html;
}
