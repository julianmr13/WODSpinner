/* =========================================================
   SPOTIFY
   ========================================================= */
// Authorization Code + PKCE flow — no client secret needed, safe to run
// entirely in the browser. Requires the page to be served over a real
// https:// URL (Spotify refuses to redirect back to a local file), and
// actual in-app playback (not just login) requires a Premium account.
const SPOTIFY_CLIENT_ID = 'a1464ef47bba4c3b981cb0a935a5d6b4';
const SPOTIFY_REDIRECT_URI = 'https://wodspinner.com/';
const SPOTIFY_SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
const SPOTIFY_LS_KEY = 'wodspinner_spotify_v1';
const SPOTIFY_RETURN_KEY = 'wodspinner_spotify_return_v1';

function loadSpotifyAuth(){
  try{
    const raw = localStorage.getItem(SPOTIFY_LS_KEY);
    if(!raw) return null;
    const auth = JSON.parse(raw);
    // if the required scope list has changed since this token was issued
    // (e.g. we add a scope the SDK turns out to need), the old token is no
    // longer valid for what we're about to ask it to do — discard it so the
    // app falls back to a genuine fresh login instead of silently retrying
    // the same broken token forever.
    if(auth.scope !== SPOTIFY_SCOPES){
      localStorage.removeItem(SPOTIFY_LS_KEY);
      return null;
    }
    return auth;
  }catch(e){}
  return null;
}
function saveSpotifyAuth(auth){
  try{ localStorage.setItem(SPOTIFY_LS_KEY, JSON.stringify({...auth, scope:SPOTIFY_SCOPES})); }catch(e){}
}
function clearSpotifyAuth(){ try{ localStorage.removeItem(SPOTIFY_LS_KEY); }catch(e){} }

let SPOTIFY = {
  auth: loadSpotifyAuth(),
  player: null,
  initializing: false,
  deviceId: null,
  deviceReady: false,
  accountError: null,
  lastError: null,
  lastMessage: null,
  searchResults: [],
  searching: false,
  currentPlaylist: null,
  currentTrack: null,
  isPlaying: false,
  volume: 0.7,
  ducked: false,
  shuffleOn: false,
  repeatMode: 'off', // 'off' | 'context' | 'track'
};

function spotifyLoggedIn(){
  return !!(SPOTIFY.auth && SPOTIFY.auth.access_token && SPOTIFY.auth.expires_at > Date.now());
}

// ---- PKCE helpers ----
function spotifyRandomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  let out = '';
  for(let i=0;i<len;i++) out += chars[arr[i]%chars.length];
  return out;
}
async function spotifySha256Base64Url(str){
  const enc = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  const bytes = new Uint8Array(digest);
  let binary = '';
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function spotifyLogin(){
  const verifier = spotifyRandomString(64);
  const challenge = await spotifySha256Base64Url(verifier);
  const state = spotifyRandomString(16);
  try{
    sessionStorage.setItem('spotify_verifier', verifier);
    sessionStorage.setItem('spotify_state', state);
    // remember where the user was so login doesn't lose their place mid-session
    localStorage.setItem(SPOTIFY_RETURN_KEY, JSON.stringify({
      screen: APP.screen, selected: APP.selected, groupSize: APP.groupSize, four: APP.four
    }));
  }catch(e){}
  const params = new URLSearchParams({
    client_id: SPOTIFY_CLIENT_ID,
    response_type: 'code',
    redirect_uri: SPOTIFY_REDIRECT_URI,
    scope: SPOTIFY_SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
    state,
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function handleSpotifyRedirect(){
  const url = new URL(window.location.href);
  const code = url.searchParams.get('code');
  const state = url.searchParams.get('state');
  const err = url.searchParams.get('error');
  if(!code && !err) return;
  window.history.replaceState({}, document.title, SPOTIFY_REDIRECT_URI);

  if(err){
    SPOTIFY.lastError = 'Spotify returned: ' + err;
  } else {
    const savedState = sessionStorage.getItem('spotify_state');
    const verifier = sessionStorage.getItem('spotify_verifier');
    if(!verifier || state!==savedState){
      SPOTIFY.lastError = 'Login could not be verified (state/verifier mismatch) \u2014 try connecting again.';
    } else {
      try{
        const resp = await fetch('https://accounts.spotify.com/api/token', {
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body: new URLSearchParams({
            grant_type:'authorization_code', code,
            redirect_uri: SPOTIFY_REDIRECT_URI, client_id: SPOTIFY_CLIENT_ID,
            code_verifier: verifier,
          })
        });
        const data = await resp.json();
        if(data.access_token){
          SPOTIFY.auth = {
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            expires_at: Date.now() + (data.expires_in*1000) - 30000,
          };
          saveSpotifyAuth(SPOTIFY.auth);
          SPOTIFY.lastError = null;
          SPOTIFY.lastMessage = 'Spotify connected successfully.';
        } else {
          SPOTIFY.lastError = 'Token exchange failed: ' + (data.error_description || data.error || resp.status);
        }
      }catch(e){
        SPOTIFY.lastError = 'Token exchange request failed: ' + e.message;
      }
    }
  }

  // ALWAYS restore the saved screen state, whether login succeeded or not —
  // previously this only ran on the success path, so any failure silently
  // dumped the user back at the landing screen with no explanation, which is
  // indistinguishable from "nothing happened."
  try{
    const raw = localStorage.getItem(SPOTIFY_RETURN_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      APP.screen = saved.screen || 'landing';
      APP.selected = saved.selected || null;
      APP.groupSize = saved.groupSize || null;
      APP.four = saved.four || [];
      localStorage.removeItem(SPOTIFY_RETURN_KEY);
    }
  }catch(e){}
}

async function spotifyRefreshToken(){
  if(!SPOTIFY.auth || !SPOTIFY.auth.refresh_token) return false;
  try{
    const resp = await fetch('https://accounts.spotify.com/api/token', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        grant_type:'refresh_token', refresh_token: SPOTIFY.auth.refresh_token,
        client_id: SPOTIFY_CLIENT_ID,
      })
    });
    const data = await resp.json();
    if(data.access_token){
      SPOTIFY.auth = {
        access_token: data.access_token,
        refresh_token: data.refresh_token || SPOTIFY.auth.refresh_token,
        expires_at: Date.now() + (data.expires_in*1000) - 30000,
      };
      saveSpotifyAuth(SPOTIFY.auth);
      return true;
    }
  }catch(e){}
  return false;
}
async function spotifyEnsureToken(){
  if(spotifyLoggedIn()) return true;
  if(SPOTIFY.auth && SPOTIFY.auth.refresh_token) return await spotifyRefreshToken();
  return false;
}
function spotifyLogout(){
  clearSpotifyAuth();
  SPOTIFY.auth = null;
  if(SPOTIFY.player){ try{ SPOTIFY.player.disconnect(); }catch(e){} }
  SPOTIFY.player = null;
  SPOTIFY.deviceId = null;
  SPOTIFY.deviceReady = false;
  SPOTIFY.currentPlaylist = null;
  renderSpotifyPanel();
}

// ---- Web Playback SDK ----
function loadSpotifySDK(){
  return new Promise((resolve)=>{
    if(window.Spotify){ resolve(); return; }
    if(document.getElementById('spotify-sdk-script')){
      window.onSpotifyWebPlaybackSDKReady = resolve;
      return;
    }
    const script = document.createElement('script');
    script.id = 'spotify-sdk-script';
    script.src = 'https://sdk.scdn.co/spotify-player.js';
    window.onSpotifyWebPlaybackSDKReady = resolve;
    document.head.appendChild(script);
  });
}
async function spotifyInitPlayer(){
  if(SPOTIFY.player || SPOTIFY.initializing) return;
  SPOTIFY.initializing = true;
  await loadSpotifySDK();
  const ok = await spotifyEnsureToken();
  if(!ok){ SPOTIFY.initializing = false; return; }
  SPOTIFY.player = new Spotify.Player({
    name: 'WOD Spinner',
    getOAuthToken: cb => cb(SPOTIFY.auth.access_token),
    volume: SPOTIFY.volume,
  });
  SPOTIFY.player.addListener('ready', ({device_id})=>{
    SPOTIFY.deviceId = device_id; SPOTIFY.deviceReady = true; SPOTIFY.initializing = false;
    renderSpotifyPanel();
  });
  SPOTIFY.player.addListener('not_ready', ()=>{ SPOTIFY.deviceReady = false; renderSpotifyPanel(); });
  SPOTIFY.player.addListener('initialization_error', ({message})=>{
    SPOTIFY.initializing = false;
    SPOTIFY.lastError = 'Player failed to initialize: ' + (message || 'unknown error');
    renderSpotifyBanner();
  });
  SPOTIFY.player.addListener('authentication_error', ({message})=>{
    SPOTIFY.initializing = false;
    SPOTIFY.lastError = 'Spotify logged you out automatically \u2014 authentication error: ' + (message || 'unknown error');
    renderSpotifyBanner();
    spotifyLogout();
  });
  SPOTIFY.player.addListener('account_error', ({message})=>{
    SPOTIFY.accountError = 'Spotify Premium is required for in-app playback.';
    SPOTIFY.lastError = 'Spotify account error: ' + (message || 'Premium required for in-app playback.');
    SPOTIFY.initializing = false;
    renderSpotifyBanner();
    renderSpotifyPanel();
  });
  SPOTIFY.player.addListener('player_state_changed', (state)=>{
    if(!state) return;
    SPOTIFY.isPlaying = !state.paused;
    SPOTIFY.shuffleOn = !!state.shuffle;
    SPOTIFY.repeatMode = ['off','context','track'][state.repeat_mode] || 'off';
    const track = state.track_window && state.track_window.current_track;
    if(track){
      SPOTIFY.currentTrack = {
        name: track.name,
        artists: (track.artists||[]).map(a=>a.name).join(', '),
        image: (track.album && track.album.images && track.album.images[0]) ? track.album.images[0].url : null,
      };
    }
    renderSpotifyPanel();
  });
  await SPOTIFY.player.connect();
}

// ---- transport controls ----
async function spotifyNext(){
  if(!SPOTIFY.player) return;
  try{ await SPOTIFY.player.nextTrack(); }catch(e){}
}
async function spotifyPrev(){
  if(!SPOTIFY.player) return;
  try{ await SPOTIFY.player.previousTrack(); }catch(e){}
}
// shuffle/repeat aren't exposed on the SDK player object itself — they go
// through the regular Web API player endpoints instead
async function spotifyToggleShuffle(){
  const ok = await spotifyEnsureToken();
  if(!ok || !SPOTIFY.deviceId) return;
  const next = !SPOTIFY.shuffleOn;
  try{
    await fetch(`https://api.spotify.com/v1/me/player/shuffle?state=${next}&device_id=${SPOTIFY.deviceId}`, {
      method:'PUT', headers:{'Authorization':'Bearer '+SPOTIFY.auth.access_token}
    });
    SPOTIFY.shuffleOn = next;
  }catch(e){}
  renderSpotifyPanel();
}
async function spotifyCycleRepeat(){
  const ok = await spotifyEnsureToken();
  if(!ok || !SPOTIFY.deviceId) return;
  const order = ['off','context','track'];
  const next = order[(order.indexOf(SPOTIFY.repeatMode)+1)%3];
  try{
    await fetch(`https://api.spotify.com/v1/me/player/repeat?state=${next}&device_id=${SPOTIFY.deviceId}`, {
      method:'PUT', headers:{'Authorization':'Bearer '+SPOTIFY.auth.access_token}
    });
    SPOTIFY.repeatMode = next;
  }catch(e){}
  renderSpotifyPanel();
}
async function spotifySearchPlaylists(query){
  if(!query || !query.trim()) return;
  SPOTIFY.searching = true;
  renderSpotifyPanel();
  const ok = await spotifyEnsureToken();
  if(!ok){ SPOTIFY.searching = false; renderSpotifyPanel(); return; }
  try{
    const resp = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=playlist&limit=8`, {
      headers:{'Authorization':'Bearer '+SPOTIFY.auth.access_token}
    });
    const data = await resp.json();
    SPOTIFY.searchResults = (data.playlists && data.playlists.items) ? data.playlists.items.filter(Boolean) : [];
  }catch(e){ SPOTIFY.searchResults = []; }
  SPOTIFY.searching = false;
  renderSpotifyPanel();
}
async function spotifySelectPlaylist(uri, name){
  SPOTIFY.currentPlaylist = {uri, name};
  SPOTIFY.searchResults = [];
  renderSpotifyPanel();
  const ok = await spotifyEnsureToken();
  if(!ok || !SPOTIFY.deviceId) return;
  try{
    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${SPOTIFY.deviceId}`, {
      method:'PUT',
      headers:{'Authorization':'Bearer '+SPOTIFY.auth.access_token, 'Content-Type':'application/json'},
      body: JSON.stringify({context_uri: uri})
    });
    SPOTIFY.isPlaying = true;
  }catch(e){}
  renderSpotifyPanel();
}
// wrapper so result tiles reference a playlist by index rather than embedding
// its name/uri directly in an inline onclick attribute — building that
// string with JSON.stringify(name) inside an already-double-quoted onclick
// attribute broke on every result, since both use double quotes
function spotifySelectPlaylistAt(idx){
  const p = SPOTIFY.searchResults[idx];
  if(!p) return;
  spotifySelectPlaylist(p.uri, p.name);
}
async function spotifyTogglePlay(){
  if(!SPOTIFY.player) return;
  try{ await SPOTIFY.player.togglePlay(); }catch(e){}
}
function spotifyChangePlaylist(){
  SPOTIFY.currentPlaylist = null;
  renderSpotifyPanel();
}

// ---- rendering ----
function renderSpotifyPanel(){
  const el = document.getElementById('spotify-panel');
  if(!el) return;

  if(!spotifyLoggedIn() && !(SPOTIFY.auth && SPOTIFY.auth.refresh_token)){
    el.innerHTML = `
      <div class="sp-head">Music</div>
      <p class="sp-note">Connect Spotify to play a playlist while this session runs. Requires Premium for in-app playback.</p>
      ${SPOTIFY.lastError ? `<p class="sp-note sp-error">${SPOTIFY.lastError}</p>` : ''}
      <button class="btn btn-spotify" onclick="spotifyLogin()">Connect Spotify</button>`;
    return;
  }

  if(SPOTIFY.accountError){
    el.innerHTML = `
      <div class="sp-head">Music</div>
      <p class="sp-note sp-error">${SPOTIFY.accountError}</p>
      <button class="btn btn-ghost" onclick="spotifyLogout()">Disconnect</button>`;
    return;
  }

  if(!SPOTIFY.player && !SPOTIFY.initializing){ spotifyInitPlayer(); }
  if(SPOTIFY.initializing || (!SPOTIFY.deviceReady && !SPOTIFY.currentPlaylist)){
    el.innerHTML = `
      <div class="sp-head">Music</div>
      <p class="sp-note">Connecting to Spotify\u2026</p>`;
    return;
  }

  if(SPOTIFY.currentPlaylist){
    const t = SPOTIFY.currentTrack;
    el.innerHTML = `
      <div class="sp-head">Music</div>
      <div class="sp-now-playing">
        <div class="sp-playlist-name">${SPOTIFY.currentPlaylist.name}</div>
        ${t ? `
          <div class="sp-track-row">
            ${t.image ? `<img class="sp-track-art" src="${t.image}">` : '<div class="sp-track-art sp-thumb-empty"></div>'}
            <div>
              <div class="sp-track-name">${t.name}</div>
              <div class="sp-track-artist">${t.artists}</div>
            </div>
          </div>` : ''}
        <div class="sp-transport">
          <button class="sp-transport-btn ${SPOTIFY.shuffleOn?'active':''}" onclick="spotifyToggleShuffle()" title="Shuffle">\u{1F500}</button>
          <button class="sp-transport-btn" onclick="spotifyPrev()" title="Previous">\u23EE</button>
          <button class="sp-transport-btn sp-transport-main" onclick="spotifyTogglePlay()" title="Play/Pause">${SPOTIFY.isPlaying?'\u23F8':'\u25B6'}</button>
          <button class="sp-transport-btn" onclick="spotifyNext()" title="Next">\u23ED</button>
          <button class="sp-transport-btn ${SPOTIFY.repeatMode!=='off'?'active':''}" onclick="spotifyCycleRepeat()" title="Repeat">${SPOTIFY.repeatMode==='track'?'\u{1F501}\u00B9':'\u{1F501}'}</button>
        </div>
        <button class="btn btn-ghost" onclick="spotifyChangePlaylist()">Change playlist</button>
      </div>`;
    return;
  }

  const results = SPOTIFY.searchResults.map((p,idx)=>`
    <div class="sp-result" onclick="spotifySelectPlaylistAt(${idx})">
      ${p.images && p.images[0] ? `<img class="sp-thumb" src="${p.images[0].url}">` : '<div class="sp-thumb sp-thumb-empty"></div>'}
      <div>
        <div class="sp-result-name">${p.name}</div>
        <div class="sp-result-owner">${p.owner ? p.owner.display_name : ''}</div>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="sp-head">Music</div>
    <div class="sp-search-row">
      <input type="text" class="sp-search-input" id="sp-search-input" placeholder="Search playlists\u2026"
        onkeydown="if(event.key==='Enter') spotifySearchPlaylists(this.value)">
      <button class="btn btn-spotify" onclick="spotifySearchPlaylists(document.getElementById('sp-search-input').value)">Search</button>
    </div>
    ${SPOTIFY.searching ? '<p class="sp-note">Searching\u2026</p>' : ''}
    ${results ? `<div class="sp-results">${results}</div>` : ''}`;
}

async function loadStreakData(){
  if(!ACCOUNT.loggedIn){
    STREAK.currentStreak = 0; STREAK.longestStreak = 0; STREAK.sessionsThisWeek = 0; STREAK.totalSessions = 0;
    STREAK.loaded = false;
    return;
  }
  STREAK.loading = true;

    const resp = await fetch('/api/me/streak');

    STREAK.loaded = true;
  }catch(e){
    STREAK.currentStreak = 0; STREAK.longestStreak = 0; STREAK.sessionsThisWeek = 0; STREAK.totalSessions = 0;

function setNavActive(){
  // Favourites/Settings buttons now live inside the account menu (only
  // rendered while that dropdown is open), so guard against them not
  // being in the DOM at all rather than assuming they always exist.
  const favBtn = document.getElementById('nav-fav');
  const setBtn = document.getElementById('nav-settings');
  if(favBtn) favBtn.classList.toggle('active', APP.screen==='favourites');
  if(setBtn) setBtn.classList.toggle('active', APP.screen==='settings');
}

// Keeps the screen from locking/dimming while on the workout screen — mainly
// so the timer stays visible and audible mid-set without someone having to
// keep tapping the screen. Not supported everywhere (desktop browsers mostly
// don't implement it at all), so this fails silently where it isn't.
let wakeLock = null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator) || wakeLock) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch(e){ wakeLock = null; /* permission denied / unsupported / page not visible yet — fine, this is a nice-to-have */ }
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} }
  wakeLock = null;
}
// the OS automatically releases a wake lock whenever the page is hidden
// (switching tabs/apps, manually locking the phone) — re-acquire it if the
// user comes back while still on the workout screen, otherwise a session
// that survived one backgrounding wouldn't survive a second.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && APP.screen==='full') requestWakeLock();
});

function render(){
  setNavActive();
  renderSpotifyBanner();
  renderImportBanner();
  if(APP.screen==='full') requestWakeLock(); else releaseWakeLock();
  if(APP.screen==='landing') return renderLanding();
  if(APP.screen==='picker') return renderPicker();
  if(APP.screen==='full') return renderFull();
  if(APP.screen==='settings') return renderSettings();
  if(APP.screen==='favourites') return renderFavourites();
  if(APP.screen==='admin') return renderAdmin();
  if(APP.screen==='popular') return renderPopular();
}

function renderSpotifyBanner(){
  const el = document.getElementById('spotify-banner');
  if(!el) return;
  if(SPOTIFY.lastError){
    el.className = '';
    el.innerHTML = `<span>Spotify: ${SPOTIFY.lastError}</span><button onclick="dismissSpotifyBanner()">Dismiss</button>`;
  } else if(SPOTIFY.lastMessage){
    el.className = 'ok';
    el.innerHTML = `<span>Spotify: ${SPOTIFY.lastMessage}</span><button onclick="dismissSpotifyBanner()">Dismiss</button>`;
  } else {
    el.className = '';
    el.innerHTML = '';
  }
}

  SPOTIFY.lastError = null;

function buildWodCardsHtml(four){
  return four.map((w,i)=>{
    const color = TIER_COLOR[i];
    let cardList = w.exercises;
    if(w.format==='wrt'){
      const trigger = w.exercises.find(e=>e.isTrigger);
      const core = w.exercises.find(e=>e.isCoreRole);
      const work = w.exercises.filter(e=>!e.isTrigger && !e.isCoreRole).slice(0,4);
      cardList = [...work, ...(core?[core]:[]), ...(trigger?[trigger]:[])];
    } else {
      cardList = w.exercises.slice(0,6);
    }
    const exLines = cardList.map(e=>`
      <div class="ex-line"><span class="ex-name">${e.name}${e.isTrigger?' (trigger)':''}${e.isCoreRole?' (core)':''}</span><span class="ex-amount">${e.amountLabel}</span></div>
    `).join('');
    const footer = w.grouping && w.grouping.short ? w.grouping.short + (w.format==='wrt' ? ` &middot; Trigger: ${w.trigger}` : '') : '';
    return `
      <div class="wod-card" style="--tier-color:${color}" onclick="openWorkout(${i})">
        <div class="wod-card-band"></div>
        <div class="wod-card-head">
          <div class="wod-card-tier">${TIER_LABELS[i]}</div>
          <div class="wod-card-duration">${w.duration} min</div>
          <div class="wod-card-format">${FORMATS[w.format].name}</div>
        </div>
        <div class="wod-card-body">
          <div class="struct">${w.structure}</div>
          ${exLines}
        </div>
        ${footer?`<div class="wod-card-foot">${footer}</div>`:''}
      </div>`;
  }).join('');
}

function openWorkout(i){
  // NOTE: tierIdx is left untouched here — it's the generation preset that
  // built this workout's actual reps/rounds/timer math, not the difficulty
  // rank. displayTier (set during generateFour) already carries the rank
  // for label/colour purposes; overwriting tierIdx would desync the timer

  APP.selected = {...APP.four[i], fromFavourites:false};

  APP.screen='full';

}

function isFavourited(workout){
  return STATE.favouriteWorkouts.some(f=>sameWorkout(f, workout));
}
function sameWorkout(a,b){
  if(a.format!==b.format || a.tierIdx!==b.tierIdx || a.groupSize!==b.groupSize) return false;
  const aIds = a.exercises.map(e=>e.id).sort().join(',');
  const bIds = b.exercises.map(e=>e.id).sort().join(',');
  return aIds===bIds;
}
function toggleFavouriteWorkout(){
  const w = APP.selected;
  const idx = STATE.favouriteWorkouts.findIndex(f=>sameWorkout(f,w));
  if(idx>=0) STATE.favouriteWorkouts.splice(idx,1);
  else STATE.favouriteWorkouts.push(JSON.parse(JSON.stringify(w)));
  saveState();
  render();
}

/* ---------- Settings ---------- */
function renderSettings(){
  if(!GYM_DATA.loggedIn){
    const readOnlyExRows = [...GYM_DATA.exercises].sort((a,b)=>a.pattern.localeCompare(b.pattern)||a.name.localeCompare(b.name)).map(ex=>`
      <tr><td>${ex.name}</td><td><span class="tag-pill">${ex.pattern}</span></td><td>${ex.equip.map(e=>`<span class="tag-pill">${e}</span>`).join(' ')}</td></tr>`).join('');
    $main.innerHTML = `
      <div class="screen">
        <div class="screen-narrow" style="max-width:1000px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <h1 class="page-title" style="font-size:28px;text-align:left;margin:0;">Settings</h1>
            <button class="btn btn-ghost" onclick="goHome()">Home</button>
          </div>
          <p class="empty-state">Sign in to customize your own equipment and exercises. Here's what's currently available:</p>
          <div class="panel-section">
            <h3>Equipment</h3>
            <div class="equip-grid">${GYM_DATA.equipment.map(eq=>`<div class="equip-item">${eq.name}</div>`).join('')}</div>
          </div>
          <div class="panel-section">
            <h3>Exercises</h3>
            <table class="ex-table">
              <thead><tr><th>Exercise</th><th>Pattern</th><th>Equipment</th></tr></thead>
              <tbody>${readOnlyExRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    return;
  }

  const masterEquip = [...GYM_DATA.equipment.filter(e=>!e.personal)].sort((a,b)=>{
    if(a.off !== b.off) return a.off ? 1 : -1; // selected equipment first, deselected sinks to the bottom
    return a.name.localeCompare(b.name);
  });
  const personalEquip = GYM_DATA.equipment.filter(e=>e.personal);

  const equipRows = masterEquip.map(eq=>`
    <label class="equip-item" style="${eq.off?'opacity:0.5;':''}">
      <input type="checkbox" ${eq.off?'':'checked'} onchange="toggleMyEquipmentOff('${eq.id}', !this.checked)">
      ${eq.name}
    </label>`).join('');

  const personalEquipRows = personalEquip.map(eq=>`
    <div class="equip-item" style="display:flex;justify-content:space-between;align-items:center;">
      <span>${eq.name}${eq.rotationOnly?' <span class="tag-pill">rotation-only</span>':''}</span>
      <button class="del-btn" onclick="deleteMyEquipment('${eq.id}')">Remove</button>
    </div>`).join('');

  const exRows = [...GYM_DATA.exercises].sort((a,b)=>a.pattern.localeCompare(b.pattern)||a.name.localeCompare(b.name)).map(ex=>{
    const removeAction = ex.personal ? `deleteMyExercise('${ex.id}')` : `toggleHiddenExercise('${ex.id}', ${ex.hidden?'false':'true'})`;
    const removeLabel = ex.personal ? 'Remove' : (ex.hidden ? 'Unhide' : 'Hide');
    return `
    <tr style="${ex.hidden?'opacity:0.5;':''}">
      <td>${ex.name}${ex.personal?' <span class="tag-pill">yours</span>':''}</td>
      <td><span class="tag-pill">${ex.pattern}</span></td>
      <td>${ex.equip.map(e=>`<span class="tag-pill">${e}</span>`).join(' ')}</td>
      <td>${ex.trigger?'<span class="tag-pill">trigger</span>':''}${ex.unilateral?' <span class="tag-pill">each side</span>':''}</td>
      <td><button class="fav-star ${GYM_DATA.favouriteExerciseIds.includes(ex.id)?'active':''}" onclick="toggleMyFavouriteExercise('${ex.id}')">&#9733;</button></td>
      <td><button class="del-btn" onclick="${removeAction}">${removeLabel}</button></td>
    </tr>`;

/* ---------- Admin: master equipment/exercise management ---------- */
let ADMIN = { loaded:false, loading:false, equipment:[], exercises:[], pendingEquipment:[], pendingExercises:[], users:[], feedback:null, editingEquipmentId:null, editingExerciseId:null };

function slugify(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_' + Math.random().toString(36).slice(2,6);
}

async function loadAdminData(){
  ADMIN.loading = true;
  try{
    const [eqResp, exResp, pendingEqResp, pendingExResp, usersResp, feedbackResp] = await Promise.all([
      fetch('/api/admin/equipment'),
      fetch('/api/admin/exercises'),
      fetch('/api/admin/review/equipment'),
      fetch('/api/admin/review/exercises'),
      fetch('/api/admin/users'),
      fetch('/api/admin/feedback-summary'),
    ]);
    const eqData = await eqResp.json();
    const exData = await exResp.json();
    const pendingEqData = await pendingEqResp.json();
    const pendingExData = await pendingExResp.json();
    const usersData = await usersResp.json();
    const feedbackData = await feedbackResp.json();
    ADMIN.equipment = eqData.equipment || [];
    ADMIN.exercises = exData.exercises || [];
    ADMIN.pendingEquipment = pendingEqData.pending || [];
    ADMIN.pendingExercises = pendingExData.pending || [];
    ADMIN.users = usersData.users || [];
    ADMIN.feedback = feedbackData;
    ADMIN.loaded = true;
  }catch(e){
    ADMIN.equipment = [];
    ADMIN.exercises = [];
    ADMIN.pendingEquipment = [];
    ADMIN.pendingExercises = [];
    ADMIN.users = [];
    ADMIN.feedback = null;
  }
  ADMIN.loading = false;
  renderAdmin();
}

  if(!ACCOUNT.loggedIn || !ACCOUNT.user || !ACCOUNT.user.is_admin){
    $main.innerHTML = `<div class="screen"><div class="screen-narrow"><p class="empty-state">Admin access only.</p></div></div>`;
    return;
  }
  if(!ADMIN.loaded){
    $main.innerHTML = `<div class="screen"><div class="screen-narrow"><p class="empty-state">Loading admin data&hellip;</p></div></div>`;
    if(!ADMIN.loading) loadAdminData();

  const tierBadge = t => t==='tfo' ? '<span class="tag-pill" style="color:var(--yellow);">TFO</span>'

      </div>`;
  }

  $main.innerHTML = `

      <div class="screen-narrow" style="max-width:1000px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">

            </label>
            <button class="btn btn-primary" onclick="adminSaveEquipment()">${ADMIN.editingEquipmentId?'Save changes':'Add equipment'}</button>

  if(!confirm('Delete this exercise from the master list?')) return;
  try{
    const resp = await fetch('/api/admin/exercises/'+id, { method:'DELETE' });
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok) alert('Delete failed: ' + (data.detail || data.error || resp.status));
  }catch(e){ alert('Delete failed: ' + e.message); }
  await loadAdminData();
}

/* ---------- Popular (gym-wide, based on real session history) ---------- */
let POPULAR = { loaded:false, loading:false, popularFormats:[], popularExercises:[], totalSessions:0, groupSize:null, four:null };

// Draws the 4 cards from the top 3 most-used formats (falling back to the
// full eligible pool if none of those fit this group size), with exercise
// selection weighted toward the most-used exercises without excluding
// everything else — a nudge, not a hard restriction.
async function generateFourFromPopular(groupSize){
  if(GYM_DATA_READY) await GYM_DATA_READY;
  const topFormats = POPULAR.popularFormats.slice(0,3).map(f=>f.format);
  const topExerciseNames = POPULAR.popularExercises.map(e=>e.name);
  POPULAR_EXERCISE_NAMES = new Set(topExerciseNames);
  const four = generateFourFromFormats(groupSize, topFormats.length ? topFormats : formatsForGroup(groupSize));
  POPULAR_EXERCISE_NAMES = new Set(); // clear immediately — never leaks into any other generation call
  return four;
}

async function selectPopularGroupSize(n){
  POPULAR.groupSize = n;
  POPULAR.four = await generateFourFromPopular(n);
  APP.groupSize = n;
  APP.four = POPULAR.four; // so the existing openWorkout(i) mechanism works unmodified
  render();
}

async function reshufflePopularFour(){
  POPULAR.four = await generateFourFromPopular(POPULAR.groupSize);
  APP.four = POPULAR.four;
  render();
}

function changePopularGroupSize(){
  POPULAR.groupSize = null;
  POPULAR.four = null;
  render();
}

async function loadPopularData(){
  POPULAR.loading = true;
  try{
    const resp = await fetch('/api/popular');
    const data = await resp.json();
    POPULAR.popularFormats = data.popularFormats || [];
    POPULAR.popularExercises = data.popularExercises || [];
    POPULAR.totalSessions = data.totalSessions || 0;
    POPULAR.loaded = true;
  }catch(e){
    POPULAR.popularFormats = [];
    POPULAR.popularExercises = [];
    POPULAR.totalSessions = 0;
  }
  POPULAR.loading = false;
  renderPopular();
}

function renderPopular(){
  if(!POPULAR.loaded){
    $main.innerHTML = `<div class="screen"><div class="screen-narrow"><p class="empty-state">Loading&hellip;</p></div></div>`;
    if(!POPULAR.loading) loadPopularData();
    return;
  }

  if(POPULAR.totalSessions===0){
    $main.innerHTML = `
      <div class="screen">
        <div class="screen-narrow">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <h1 class="page-title" style="font-size:28px;text-align:left;margin:0;">Popular</h1>
            <button class="btn btn-ghost" onclick="goHome()">Home</button>
          </div>
          <p class="empty-state">Nothing logged yet \u2014 once people start a few workouts, the most-used formats and exercises will show up here.</p>
        </div>
      </div>`;
    return;
  }

  const maxFormatCount = Math.max(...POPULAR.popularFormats.map(f=>f.count));
  const formatRows = POPULAR.popularFormats.map(f=>{
    const pct = Math.round((f.count/maxFormatCount)*100);
    const label = (FORMATS[f.format] && FORMATS[f.format].name) || f.format;
    return `
      <div class="pop-row">
        <div class="pop-row-label">${label}</div>
        <div class="pop-row-bar-wrap"><div class="pop-row-bar" style="width:${pct}%"></div></div>
        <div class="pop-row-count">${f.count}</div>
      </div>`;
  }).join('');

  const maxExCount = Math.max(...POPULAR.popularExercises.map(e=>e.count));
  const exerciseRows = POPULAR.popularExercises.map(e=>{
    const pct = Math.round((e.count/maxExCount)*100);
    return `
      <div class="pop-row">
        <div class="pop-row-label">${e.name}</div>
        <div class="pop-row-bar-wrap"><div class="pop-row-bar" style="width:${pct}%"></div></div>
        <div class="pop-row-count">${e.count}</div>
      </div>`;
  }).join('');

  let sizeTiles = '';
  for(let i=1;i<=12;i++){
    sizeTiles += `<div class="size-tile" onclick="selectPopularGroupSize(${i})">
      <div class="num">${i}</div>
      <div class="label">${i===1?'solo':i<=2?'pair':'people'}</div>
    </div>`;
  }

  const generatorSection = POPULAR.four ? `
    <div class="panel-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;">Popular workouts for ${POPULAR.groupSize} ${POPULAR.groupSize===1?'person':'people'}</h3>
        <button class="btn btn-ghost" onclick="changePopularGroupSize()">Change group size</button>
      </div>
      <div class="card-row">${buildWodCardsHtml(POPULAR.four)}</div>
      <div class="spin-again-wrap">
        <button class="btn-spin" onclick="reshufflePopularFour()">Spin again!</button>
      </div>
    </div>` : `
    <div class="panel-section">
      <h3>Generate from the most popular</h3>
      <p class="page-sub" style="margin-bottom:16px;">Pulls from the top few formats above, with popular exercises weighted in.</p>
      <div class="size-grid">${sizeTiles}</div>
    </div>`;

  $main.innerHTML = `
    <div class="screen">
      <div class="screen-narrow">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h1 class="page-title" style="font-size:28px;text-align:left;margin:0;">Popular</h1>
          <button class="btn btn-ghost" onclick="goHome()">Home</button>
        </div>
        <p class="empty-state" style="margin-bottom:24px;">Based on ${POPULAR.totalSessions} logged session${POPULAR.totalSessions===1?'':'s'} across everyone.</p>

        <div class="panel-section">
          <h3>Most-used formats</h3>
          ${formatRows}
        </div>

        <div class="panel-section">
          <h3>Most-used exercises</h3>
          ${exerciseRows}
        </div>

        ${generatorSection}
      </div>
    </div>`;
}

/* ---------- Favourites ---------- */
function renderFavourites(){
  const sizes = ['all', ...new Set(STATE.favouriteWorkouts.map(f=>f.groupSize))].sort((a,b)=>a==='all'?-1:a-b);
  const filterVal = APP._favFilter || 'all';
  const opts = sizes.map(s=>`<option value="${s}" ${s==filterVal?'selected':''}>${s==='all'?'All group sizes':s+' people'}</option>`).join('');

  const list = STATE.favouriteWorkouts.filter(f=>filterVal==='all' || f.groupSize==filterVal);
  const cards = list.map((w,idx)=>{
    const missing = w.exercises.some(e=>{
      const full = allExercises().find(x=>x.id===e.id);
      return !full || !exerciseUsable(full);
    });
    return `<div class="fav-card ${missing?'disabled':''}" onclick="${missing?'':`loadFavourite(${STATE.favouriteWorkouts.indexOf(w)})`}">
      <h4>${FORMATS[w.format].name} &mdash; ${w.duration} min</h4>
      <div class="fav-meta">${w.groupSize} people &middot; ${TIER_LABELS[(w.displayTier!==undefined)?w.displayTier:w.tierIdx]}</div>
      ${missing?'<div class="fav-missing">Needs equipment not currently ticked</div>':''}
    </div>`;
  }).join('');

  $main.innerHTML = `
    <div class="screen">
      <div class="screen-narrow" style="max-width:1000px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <h1 class="page-title" style="font-size:28px;text-align:left;margin:0;">Favourite workouts</h1>
          <button class="btn btn-ghost" onclick="goHome()">Home</button>
        </div>
        <div class="fav-filter">
          Filter by group size:
          <select onchange="APP._favFilter=this.value; render();">${opts}</select>
        </div>
        ${list.length? `<div class="fav-grid">${cards}</div>` : `<div class="empty-state">No favourites saved yet &mdash; star a workout from its full-screen view to keep it here.</div>`}
      </div>
    </div>`;
}
function loadFavourite(idx){
  const w = STATE.favouriteWorkouts[idx];
  APP.selected = {...JSON.parse(JSON.stringify(w)), fromFavourites:true};
  APP.screen='full';
  render();
}

/* =========================================================
   ACCOUNT (Google login via our own backend)
   ========================================================= */
let ACCOUNT = { loading: true, loggedIn: false, user: null, menuOpen: false };

async function checkLoginStatus(){
  try{
    const resp = await fetch('/api/me');
    const data = await resp.json();
    ACCOUNT.loggedIn = !!data.loggedIn;
    ACCOUNT.user = data.user || null;
  }catch(e){
    ACCOUNT.loggedIn = false;
    ACCOUNT.user = null;
  }
  ACCOUNT.loading = false;
  renderAccountWidget();
  renderImportBanner(); // show the one-time legacy-data import prompt now that we know whether they're logged in
  refreshServerRecentHistory(); // don't block the UI on this — repeat-avoidance just uses whatever's cached when generation runs
  loadGymData(); // equipment/exercises differ between logged-in (personal overlay) and logged-out (master-only) — refresh whenever login state is checked
  loadStreakData(); // now shown on the home screen — fetch proactively so it's ready before the user gets there, not a visible pop-in
}

function signInWithGoogle(){
  window.location.href = '/auth/google/login';
}

async function doLogout(){
  try{ await fetch('/auth/logout', { method:'POST' }); }catch(e){}
  ACCOUNT.loggedIn = false;
  ACCOUNT.user = null;
  ACCOUNT.menuOpen = false;
  SERVER_RECENT_IDS = new Set();
  STREAK.loaded = false;
  renderAccountWidget();
  loadGymData(); // drop back to master-only, read-only data now that personal overrides no longer apply
}

function toggleAccountMenu(e){
  if(e) e.stopPropagation();
  ACCOUNT.menuOpen = !ACCOUNT.menuOpen;
  renderAccountWidget();
}

function closeMenuAnd(fn){
  ACCOUNT.menuOpen = false;
  renderAccountWidget();
  fn();
}

function avatarHtml(user, sizeClass, fontSize){
  if(user && user.avatar_url){
    return `<img class="${sizeClass}" src="${user.avatar_url}" alt="">`;
  }
  const initial = ((user && (user.nickname || user.display_name || user.email)) || '?').trim().charAt(0).toUpperCase();
  return `<div class="${sizeClass} avatar-placeholder" style="font-size:${fontSize||12}px;">${initial}</div>`;
}

function renderAccountWidget(){
  const el = document.getElementById('account-widget');
  if(!el) return;
  if(ACCOUNT.loading){ el.innerHTML = ''; return; }

  if(!ACCOUNT.loggedIn){
    // Favourites/Settings are user-specific once logged in, so there's
    // nothing for a logged-out visitor to open — just the sign-in button.
    el.innerHTML = `<button class="nav-btn btn-google" onclick="signInWithGoogle()">Sign in</button>`;
    return;
  }

  const name = (ACCOUNT.user && (ACCOUNT.user.nickname || ACCOUNT.user.display_name || ACCOUNT.user.email)) || 'Account';
  const firstName = name.split(' ')[0];
  el.innerHTML = `
    <div class="account-menu-wrap">
      <button class="nav-btn account-pill" onclick="toggleAccountMenu(event)">${avatarHtml(ACCOUNT.user, 'avatar-thumb')} ${firstName} &#9662;</button>
      ${ACCOUNT.menuOpen ? `
        <div class="account-dropdown" onclick="event.stopPropagation()">
          <div class="account-dropdown-name">${name}</div>
          <div class="account-dropdown-email">${ACCOUNT.user.email || ''}</div>
          <div class="account-dropdown-divider"></div>
          <button class="account-dropdown-item" onclick="closeMenuAnd(showFavourites)">Favourites</button>
          <button class="account-dropdown-item" onclick="closeMenuAnd(showSettings)">Settings</button>
          ${ACCOUNT.user.is_admin ? `<button class="account-dropdown-item" onclick="closeMenuAnd(showAdmin)">Admin</button>` : ''}
          <div class="account-dropdown-divider"></div>
          <button class="account-dropdown-logout" onclick="doLogout()">Log out</button>
        </div>` : ''}
    </div>`;
}

// close the dropdown when tapping anywhere else on the page
document.addEventListener('click', function(){
  if(ACCOUNT.menuOpen){ ACCOUNT.menuOpen = false; renderAccountWidget(); }
});

/* ---------- init ---------- */
// process any Spotify login redirect (?code=...) before the first render,
// so a returning user lands back where they were, already connected
async function processSpotifyReturn(){
  await handleSpotifyRedirect();
  render();
}
checkLoginStatus();
// mobile browsers can restore this page from cache when Spotify redirects
// back (treating it like a "back" navigation rather than a fresh load), which
// would skip the normal script run entirely and silently drop the ?code=/
// ?error= params. 'pageshow' fires on both fresh loads AND cache restores,
// so re-check for those params there too as a safety net.
window.addEventListener('pageshow', function(){
  const url = new URL(window.location.href);
  if(url.searchParams.get('code') || url.searchParams.get('error')){
    processSpotifyReturn();
  }
});
processSpotifyReturn();

</script>
